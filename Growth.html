<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* Palette sampled from Growth.jpg — chestnut coat, copper gold jewelry, purple-indigo nails, warm mahogany shadow */
    --chestnut:     #7c3a1e;
    --mahogany:     #3b1a0e;
    --copper:       #b87333;
    --warm-gold:    #d4a45a;
    --lavender:     #8b7dbe;
    --purple-mid:   #6055a0;
    --ivory:        #f5ede3;
    --warm-white:   #fdf6ef;
    --glass:        rgba(60, 26, 14, 0.14);
    --glass-hover:  rgba(60, 26, 14, 0.24);
    --glass-b:      rgba(212, 164, 90, 0.32);
    --glass-b2:     rgba(139, 125, 190, 0.30);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Mono', monospace;
    color: var(--ivory);
    background: var(--mahogany);
    overflow-x: hidden;
  }

  /* ── OUTER WRAPPER ── */
  .page-wrap {
    position: relative;
    min-height: 100vh;
  }

  /* ── BACKGROUND IMAGE LAYER ── */
  .bg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 3rem 0;
    background: var(--mahogany);
  }
  .bg-layer img {
    width: auto;
    max-width: 520px;
    height: auto;
    max-height: 90vh;
    object-fit: contain;
    display: block;
    border: 6px solid #ffffff;
    box-shadow: 0 12px 50px rgba(0,0,0,0.45);
    position: relative;
    z-index: 1;
  }
  .bg-layer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      160deg,
      rgba(30, 10, 5, 0.55) 0%,
      rgba(45, 20, 8, 0.38) 40%,
      rgba(20, 8, 3, 0.65) 100%
    );
  }

  /* ── PAGE CONTENT (z-index above bg-layer) ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOPBAR ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 50px;
    background: rgba(30, 10, 5, 0.48);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(212, 164, 90, 0.18);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  #topbar a {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 400; letter-spacing: 0.08em;
    color: var(--ivory); text-decoration: none;
    display: flex; align-items: center; gap: 5px;
    opacity: 0.78; transition: opacity 0.2s;
    text-transform: uppercase;
  }
  #topbar a:hover { opacity: 1; }
  #topbar .topbar-date {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; color: var(--warm-gold); opacity: 0.75;
    letter-spacing: 0.10em; text-transform: uppercase;
  }

  /* ── MASTHEAD ── */
  .masthead {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 7rem 1.5rem 4rem;
    text-align: center;
  }
  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.60rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--warm-gold);
    opacity: 0.85;
    margin-bottom: 1.1rem;
  }
  .masthead h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 300;
    line-height: 0.92;
    color: var(--ivory);
    letter-spacing: -0.01em;
  }
  .masthead h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--warm-gold);
  }
  .scroll-cue {
    margin-top: 3rem;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    opacity: 0.45;
    animation: bounce 2s ease-in-out infinite;
  }
  .scroll-cue span { font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }

  /* ── CONTENT SECTIONS ── */
  .content {
    padding: 0 1.5rem 5rem;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
  }

  /* Section label */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.60rem;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--warm-gold);
    opacity: 0.75;
    margin-bottom: 1.2rem;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, rgba(212,164,90,0.35), transparent);
  }

  /* Glass card */
  .glass-card {
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-b);
    border-radius: 16px;
    padding: 2rem;
  }

  /* ── WHO I AM ── */
  .iam-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .iam-list li {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.25rem, 3.5vw, 1.6rem);
    font-weight: 300;
    color: var(--ivory);
    line-height: 1.3;
    border-bottom: 1px solid rgba(212,164,90,0.12);
    padding-bottom: 0.85rem;
  }
  .iam-list li:last-child { border-bottom: none; padding-bottom: 0; }
  .iam-prefix {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--warm-gold);
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 3px;
  }

  /* ── I AM EDIT MODE ── */
  .iam-edit-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-left: auto;
    background: none;
    border: 1px solid rgba(212,164,90,0.25);
    border-radius: 6px;
    color: var(--warm-gold);
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.28rem 0.7rem;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s, border-color 0.2s, background 0.2s;
  }
  .iam-edit-btn:hover { opacity: 1; border-color: rgba(212,164,90,0.55); background: rgba(212,164,90,0.08); }
  .iam-card-header {
    display: flex;
    align-items: center;
    margin-bottom: 1.2rem;
  }
  .iam-card-header .section-label { margin-bottom: 0; }
  .iam-list li { position: relative; }
  .iam-list li .iam-text {
    flex: 1;
    outline: none;
  }
  .iam-list.editing li .iam-text {
    border-bottom: 1px dashed rgba(212,164,90,0.35);
    padding-bottom: 2px;
    cursor: text;
  }
  .iam-del-btn {
    display: none;
    background: none;
    border: none;
    color: rgba(212,164,90,0.45);
    font-size: 1rem;
    cursor: pointer;
    padding: 0 0 0 0.5rem;
    line-height: 1;
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .iam-del-btn:hover { color: #e07070; }
  .iam-list.editing li .iam-del-btn { display: block; }
  .iam-add-row {
    display: none;
    margin-top: 1rem;
    gap: 0.6rem;
    align-items: center;
  }
  .iam-list.editing ~ .iam-add-row { display: flex; }
  .iam-add-input {
    flex: 1;
    background: rgba(212,164,90,0.06);
    border: 1px solid rgba(212,164,90,0.25);
    border-radius: 6px;
    color: var(--ivory);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 300;
    padding: 0.45rem 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .iam-add-input::placeholder { color: rgba(245,240,230,0.3); font-style: italic; }
  .iam-add-input:focus { border-color: rgba(212,164,90,0.55); }
  .iam-add-submit {
    background: rgba(212,164,90,0.15);
    border: 1px solid rgba(212,164,90,0.35);
    border-radius: 6px;
    color: var(--warm-gold);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .iam-add-submit:hover { background: rgba(212,164,90,0.28); }
  .iam-save-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.12em;
    color: rgba(212,164,90,0.6);
    text-transform: uppercase;
    text-align: right;
    margin-top: 0.6rem;
    min-height: 1rem;
    transition: opacity 0.4s;
  }

  /* ── GOALS ── */
  .goals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  .goal-item {
    background: rgba(160, 80, 30, 0.50);
    border: 1px solid rgba(160, 80, 30, 0.35);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    transition: transform 0.25s, background 0.25s;
  }
  .goal-item:hover {
    transform: translateY(-3px);
    background: rgba(160, 80, 30, 0.65);
  }
  .goal-check {
    width: 22px; height: 22px;
    border: 1.5px solid rgba(139,125,190,0.55);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .goal-check svg { opacity: 0.6; }
  .goal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-weight: 400;
    color: var(--ivory);
    line-height: 1.3;
  }
  .goal-freq {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ivory);
    opacity: 0.80;
  }

  /* ── SUBPAGE CARDS ── */
  .subpages-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
  @media (max-width: 480px) {
    .subpages-grid { grid-template-columns: 1fr; }
  }
  .subpage-card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 3/4;
    text-decoration: none;
    display: flex;
    align-items: flex-end;
    border: 1px solid rgba(212,164,90,0.18);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .subpage-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  .subpage-card .card-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: transform 0.5s ease;
  }
  .subpage-card:hover .card-bg { transform: scale(1.04); }
  .subpage-card .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(20, 6, 2, 0.82) 0%,
      rgba(20, 6, 2, 0.30) 55%,
      transparent 100%
    );
  }
  .subpage-card .card-body {
    position: relative;
    z-index: 2;
    padding: 1.4rem 1.3rem;
    width: 100%;
  }
  .card-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--warm-gold);
    opacity: 0.80;
    margin-bottom: 0.5rem;
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 300;
    color: var(--ivory);
    line-height: 1.0;
  }
  .card-title em {
    font-style: italic;
    color: var(--warm-gold);
  }
  .card-arrow {
    margin-top: 0.9rem;
    width: 28px; height: 28px;
    border: 1px solid rgba(212,164,90,0.45);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .subpage-card:hover .card-arrow {
    background: rgba(212,164,90,0.25);
    border-color: rgba(212,164,90,0.75);
  }

  /* ── PLACEHOLDER BG COLORS for cards (images added in GitHub) ── */
  .card-inspo    { background: rgba(160, 80, 30, 0.50); }
  .card-journal  { background: rgba(160, 80, 30, 0.50); }
  .card-therapy  { background: rgba(160, 80, 30, 0.50); }
  .card-wants    { background: rgba(160, 80, 30, 0.50); }

  /* Card BG images — from GitHub raw, same as other pages */
  .card-inspo .card-bg    { background-image: url('https://javauntgarcia.github.io/Notion/inspo.jpg'); }
  .card-journal .card-bg  { background-image: url('https://javauntgarcia.github.io/Notion/journal.JPG'); }
  .card-therapy .card-bg  { background-image: url('https://javauntgarcia.github.io/Notion/therapy.jpg'); }
  .card-wants .card-bg    { background-image: url('https://javauntgarcia.github.io/Notion/wants.jpg'); }

  /* Fade-in animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .masthead, .content > * {
    animation: fadeUp 0.8s ease both;
  }
  .content > *:nth-child(1) { animation-delay: 0.15s; }
  .content > *:nth-child(2) { animation-delay: 0.28s; }
  .content > *:nth-child(3) { animation-delay: 0.42s; }
</style>
</head>

// ── Supabase helpers ──
function sbGet(cb) {
  fetch(SB_URL + '/rest/v1/' + IAM_TABLE + '?id=eq.' + encodeURIComponent(IAM_ID) + '&limit=1', {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  }).then(function(r){ return r.json(); })
    .then(function(d){ cb(d && d[0] ? d[0] : null); })
    .catch(function(){ cb(null); });
}

function sbSave(items) {
  var body = JSON.stringify({ id: IAM_ID, items: items });
  // Upsert via POST with on-conflict header
  fetch(SB_URL + '/rest/v1/' + IAM_TABLE, {
    method: 'POST',
    headers: {
      apikey: SB_KEY,
      Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: body
  }).then(function() {
    showSaveIndicator('Saved');
  }).catch(function() {
    // Fallback: save to localStorage
    try { localStorage.setItem('growth_iam_items', JSON.stringify(items)); } catch(e) {}
    showSaveIndicator('Saved locally');
  });
}

function showSaveIndicator(msg) {
  var el = document.getElementById('iam-save-indicator');
  if (!el) return;
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(iamSaveTimer);
  iamSaveTimer = setTimeout(function() { el.style.opacity = '0'; }, 2500);
}

// ── Render ──
function iamRender() {
  var ul = document.getElementById('iam-list');
  if (!ul) return;
  ul.innerHTML = '';
  iamItems.forEach(function(text, i) {
    var li = document.createElement('li');
    li.innerHTML =
      '<span class="iam-prefix">I am</span>' +
      '<span class="iam-text" ' + (iamEditing ? 'contenteditable="true"' : '') + ' data-idx="' + i + '">' + escHtml(text) + '</span>' +
      '<button class="iam-del-btn" title="Remove" onclick="iamDelete(' + i + ')">×</button>';
    if (iamEditing) {
      li.querySelector('.iam-text').addEventListener('blur', function() {
        iamItems[i] = this.textContent.trim() || iamItems[i];
        iamDebounceSave();
      });
    }
    ul.appendChild(li);
  });
  if (iamEditing) ul.classList.add('editing'); else ul.classList.remove('editing');
  // show/hide add row
  var addRow = document.getElementById('iam-add-row');
  if (addRow) addRow.style.display = iamEditing ? 'flex' : 'none';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Toggle edit mode ──
function iamToggleEdit() {
  if (iamEditing) {
    // Leaving edit mode — collect any unsaved text edits
    var spans = document.querySelectorAll('#iam-list .iam-text');
    spans.forEach(function(s) {
      var idx = parseInt(s.getAttribute('data-idx'));
      if (!isNaN(idx)) iamItems[idx] = s.textContent.trim() || iamItems[idx];
    });
    iamEditing = false;
    iamRender();
    iamSaveAll();
    document.getElementById('iam-edit-btn').innerHTML =
      '<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M7.5 1.5l2 2L3 10H1V8L7.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Edit';
  } else {
    iamEditing = true;
    iamRender();
    document.getElementById('iam-edit-btn').innerHTML =
      '<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 9.5l8-8M5 1.5h4v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Done';
    showSaveIndicator('Tap any line to edit');
  }
}

// ── Add item ──
function iamAddItem() {
  var input = document.getElementById('iam-add-input');
  var val = input ? input.value.trim() : '';
  if (!val) return;
  iamItems.push(val);
  input.value = '';
  iamRender();
  iamSaveAll();
}

// ── Delete item ──
function iamDelete(i) {
  iamItems.splice(i, 1);
  iamRender();
  iamSaveAll();
}

// ── Save helpers ──
function iamDebounceSave() {
  clearTimeout(iamSaveTimer);
  iamSaveTimer = setTimeout(iamSaveAll, 800);
}

function iamSaveAll() {
  sbSave(iamItems);
}

// ── Bootstrap: load from Supabase, fall back to localStorage, then defaults ──
sbGet(function(row) {
  if (row && Array.isArray(row.items) && row.items.length) {
    iamItems = row.items;
  } else {
    try {
      var stored = localStorage.getItem('growth_iam_items');
      iamItems = stored ? JSON.parse(stored) : IAM_DEFAULTS.slice();
    } catch(e) {
      iamItems = IAM_DEFAULTS.slice();
    }
  }
  iamRender();
});
</script>
</body>
</html>
