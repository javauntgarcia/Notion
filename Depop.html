<!DOCTYPE html>
<html lang="en">
<head>
  <!--
  ============================================================
  DEPOP.HTML — Javaun Garcia Personal Dashboard
  GitHub Pages URL: https://javauntgarcia.github.io/Notion/Depop.html
  Notion embed: paste that URL into a Notion /embed block.
  ============================================================
  EDIT GUIDE — search these strings to find each section:
    EDIT: PALETTE        → CSS custom properties / color variables
    EDIT: BG URL         → Background image URL
    EDIT: OVERLAY        → Dark overlay gradient on the background
    EDIT: BACK LINK      → Topbar back arrow destination
    EDIT: OVERVIEW       → Stats bar ids
    EDIT: INVENTORY      → Active table render
    EDIT: ADD FORM       → Modal fields
    EDIT: ARCHIVE        → Archive section
    EDIT: LOCALSTORAGE   → localStorage key names (dep_ prefix)
    EDIT: SEED DATA      → Pre-seeded inventory items
    EDIT: FOOTER TEXT    → Footer phrase

  ============================================================
  UPDATED [egress fix]:
    - Images are now compressed client-side (max 500px wide,
      JPEG quality 0.72) BEFORE upload — typically 20-60KB
      instead of 1-5MB.
    - Images are uploaded to a Supabase STORAGE bucket
      ("depop-images") instead of being embedded as base64
      inside the JSON row. The `items` array now only stores
      a small image URL string per item, not the image data.
    - This requires a Storage bucket named "depop-images" to
      exist in your Supabase project, set to PUBLIC, with an
      insert policy allowing the anon/publishable key to
      upload. See the note at the bottom of the <script> block.
  ============================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       EDIT: PALETTE
    ========================================================= */
    :root {
      --primary:       #2a1a1a;
      --primary-mid:   #3d2222;
      --accent:        #c97b6a;
      --highlight:     #e8a898;
      --warm-white:    #f7ede8;
      --ivory:         #ede0d9;
      --glass:         rgba(201, 123, 106, 0.10);
      --glass-hover:   rgba(201, 123, 106, 0.18);
      --glass-b:       rgba(232, 168, 152, 0.28);
      --sold-color:    #7aad8a;
      --warn-color:    #d4a84b;
      --ink:           #1c1c1c;
      --border:        rgba(0,0,0,0.13);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Mono', monospace;
      color: var(--warm-white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================================
       BACKGROUND
    ========================================================= */
    /* EDIT: BG URL */
    .page-wrap { position: relative; min-height: 100vh; }

    .bg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-layer img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
    }

    /* EDIT: OVERLAY */
    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(42,16,16,0.72) 0%,
        rgba(55,22,18,0.65) 40%,
        rgba(38,14,14,0.78) 100%
      );
      z-index: 1;
    }

    .page-content { position: relative; z-index: 2; }

    /* =========================================================
       TOPBAR
    ========================================================= */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 48px;
      background: rgba(42,26,26,0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232,168,152,0.10);
    }

    /* EDIT: BACK LINK */
    .topbar-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--highlight);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    .topbar-back:hover { opacity: 1; }

    .topbar-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--highlight);
      opacity: 0.55;
      letter-spacing: 0.12em;
    }

    /* =========================================================
       MASTHEAD
    ========================================================= */
    .masthead {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1rem 4rem;
      text-align: center;
    }

    .masthead h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 10vw, 6.5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--warm-white);
    }

    .masthead h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--highlight);
    }

    .scroll-cue {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      opacity: 0.45;
    }

    .scroll-cue span {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--highlight);
    }

    .scroll-arrow { animation: bob 1.8s ease-in-out infinite; }

    /* =========================================================
       SECTIONS
    ========================================================= */
    .section {
      max-width: 960px;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.75;
      margin-bottom: 1.5rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,123,106,0.18), transparent);
      max-width: 960px;
      margin: 0 auto;
    }

    /* =========================================================
       OVERVIEW STATS
    ========================================================= */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .stat-card {
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-b);
      border-radius: 14px;
      padding: 1.5rem 1rem;
      text-align: center;
      transition: background 0.25s, transform 0.25s;
    }
    .stat-card:hover { background: var(--glass-hover); transform: translateY(-4px); }

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 600;
      color: var(--highlight);
      line-height: 1;
    }

    .stat-lbl {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--warm-white);
      opacity: 0.6;
      margin-top: 0.4rem;
    }

    /* =========================================================
       SECTION HEADER ROW
    ========================================================= */
    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .count-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      background: rgba(201,123,106,0.15);
      border: 1px solid rgba(201,123,106,0.25);
      color: var(--highlight);
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
    }

    /* =========================================================
       PILL BUTTON
    ========================================================= */
    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.2rem;
      border-radius: 99px;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      border: 1px solid rgba(201,123,106,0.30);
      background: rgba(201,123,106,0.10);
      color: var(--accent);
      transition: background 0.2s;
    }
    .btn-pill:hover { background: rgba(201,123,106,0.20); }

    /* =========================================================
       TABLE
    ========================================================= */
    .table-wrap {
      background: rgba(42,16,16,0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-b);
      border-radius: 14px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      border-bottom: 1px solid rgba(232,168,152,0.15);
    }

    th {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--highlight);
      opacity: 0.6;
      padding: 0.85rem 1rem;
      text-align: left;
      white-space: nowrap;
    }

    th:first-child  { width: 56px; text-align: center; }
    th:nth-child(3) { width: 200px; }
    th:nth-child(4) { width: 100px; text-align: center; }
    th:nth-child(5) { width: 80px; text-align: center; }
    th:nth-child(6) { width: 90px; text-align: center; }
    th:last-child   { width: 50px; text-align: center; }

    tbody tr {
      border-bottom: 1px solid rgba(232,168,152,0.07);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(201,123,106,0.06); }

    td {
      padding: 0.85rem 1rem;
      color: var(--warm-white);
      vertical-align: middle;
    }
    td:first-child { text-align: center; }

    /* Thumbnail */
    .item-thumb {
      width: 40px; height: 40px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--glass-b);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .item-thumb:hover { transform: scale(1.08); }

    .thumb-placeholder {
      width: 40px; height: 40px;
      border: 1.5px dashed rgba(232,168,152,0.25);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: auto;
      transition: border-color 0.2s;
    }
    .thumb-placeholder:hover { border-color: var(--accent); }

    .item-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--warm-white);
      line-height: 1.2;
    }

    .item-link a {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(201,123,106,0.35);
      padding-bottom: 1px;
      letter-spacing: 0.08em;
      word-break: break-all;
    }
    .item-link a:hover { color: var(--highlight); border-color: var(--highlight); }

    .item-link-none {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--warm-white);
      opacity: 0.25;
    }

    /* Toggle pills */
    .toggle-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      font-family: 'DM Mono', monospace;
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }

    .pill-yes {
      background: rgba(122,173,138,0.15);
      color: var(--sold-color);
      border-color: rgba(122,173,138,0.30);
    }
    .pill-yes:hover { background: rgba(122,173,138,0.25); }

    .pill-no {
      background: rgba(247,237,232,0.06);
      color: var(--warm-white);
      border-color: rgba(247,237,232,0.12);
      opacity: 0.55;
    }
    .pill-no:hover { opacity: 0.9; background: rgba(247,237,232,0.10); }

    .pill-shipped {
      background: rgba(122,173,138,0.20);
      color: var(--sold-color);
      border-color: rgba(122,173,138,0.40);
    }

    .pkg-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      text-align: center;
      width: 48px;
      border: 1px solid rgba(232,168,152,0.18);
      border-radius: 6px;
      padding: 0.3rem 0.4rem;
      background: rgba(201,123,106,0.06);
      color: var(--warm-white);
      -moz-appearance: textfield;
      margin: auto;
      display: block;
      transition: border-color 0.2s;
    }
    .pkg-count:focus { outline: none; border-color: var(--accent); }
    .pkg-count::-webkit-inner-spin-button,
    .pkg-count::-webkit-outer-spin-button { -webkit-appearance: none; }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--warm-white);
      opacity: 0.3;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s, opacity 0.2s;
      line-height: 1;
      display: block;
      margin: auto;
    }
    .btn-icon:hover { color: #e07070; opacity: 1; }

    td.actions { text-align: center; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--warm-white);
      opacity: 0.35;
    }
    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-style: italic;
    }

    /* =========================================================
       ARCHIVE
    ========================================================= */
    .archive-toggle-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 1.25rem;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    .archive-toggle-btn:hover { opacity: 1; }

    .archive-caret {
      display: inline-block;
      transition: transform 0.25s;
      font-size: 0.65rem;
    }
    .archive-caret.open { transform: rotate(90deg); }

    .archive-table-wrap {
      display: none;
    }
    .archive-table-wrap.visible {
      display: block;
    }

    .archive-table-wrap .table-wrap {
      opacity: 0.75;
    }

    /* =========================================================
       MODAL
    ========================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(42,16,16,0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: rgba(42,22,20,0.97);
      border: 1px solid var(--glass-b);
      border-radius: 18px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform 0.3s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--warm-white);
    }
    .modal-title em { font-style: italic; font-weight: 300; color: var(--highlight); }

    .modal-close {
      background: none;
      border: none;
      color: var(--warm-white);
      opacity: 0.4;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      transition: opacity 0.2s;
    }
    .modal-close:hover { opacity: 1; }

    .form-group { margin-bottom: 1rem; }

    .form-label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.85;
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      background: rgba(201,123,106,0.08);
      border: 1px solid rgba(201,123,106,0.22);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--warm-white);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: rgba(201,123,106,0.55); }
    .form-input::placeholder { color: var(--warm-white); opacity: 0.25; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    /* Image upload zone */
    .img-upload-zone {
      position: relative;
      width: 100%;
      height: 120px;
      border: 1.5px dashed rgba(201,123,106,0.30);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
    }
    .img-upload-zone:hover { border-color: var(--accent); background: rgba(201,123,106,0.05); }
    .img-upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 1.4rem; opacity: 0.5; }
    .upload-hint {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--warm-white);
      opacity: 0.35;
    }

    .upload-preview {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Toggle row (Yes/No) */
    .form-toggle-row {
      display: grid;
      gap: 0.4rem;
    }

    .form-toggle-btn {
      padding: 0.45rem 0;
      border-radius: 8px;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid rgba(232,168,152,0.15);
      background: rgba(201,123,106,0.06);
      color: var(--warm-white);
      opacity: 0.5;
      transition: all 0.2s;
      user-select: none;
    }
    .form-toggle-btn.active {
      background: rgba(201,123,106,0.18);
      border-color: rgba(201,123,106,0.40);
      color: var(--accent);
      opacity: 1;
    }

    .modal-footer {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(201,123,106,0.12);
    }

    .btn-cancel {
      display: inline-flex;
      align-items: center;
      padding: 0.55rem 1.2rem;
      border-radius: 99px;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      border: 1px solid rgba(247,237,232,0.15);
      background: transparent;
      color: var(--warm-white);
      opacity: 0.55;
      transition: opacity 0.2s;
    }
    .btn-cancel:hover { opacity: 0.9; }

    .btn-save {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.4rem;
      border-radius: 99px;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      border: 1px solid rgba(201,123,106,0.40);
      background: rgba(201,123,106,0.15);
      color: var(--accent);
      transition: background 0.2s;
    }
    .btn-save:hover { background: rgba(201,123,106,0.28); }
    .btn-save:disabled { opacity: 0.5; cursor: default; }

    /* =========================================================
       FOOTER
    ========================================================= */
    footer {
      text-align: center;
      padding: 3rem 1rem 4rem;
    }
    footer p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      /* EDIT: FOOTER TEXT */
      color: var(--accent);
      opacity: 0.35;
    }

    /* =========================================================
       ANIMATIONS
    ========================================================= */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(6px); }
    }

    .anim-1 { animation: fadeUp 0.8s ease 0.1s both; }
    .anim-2 { animation: fadeUp 0.8s ease 0.2s both; }
    .anim-3 { animation: fadeUp 0.8s ease 0.3s both; }

    /* =========================================================
       RESPONSIVE
    ========================================================= */
    @media (max-width: 700px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
    @media (max-width: 500px) {
      .page { padding: 40px 20px 60px; }
    }
  </style>
</head>

<body>
<div class="page-wrap">

  <!-- EDIT: BG URL -->
  <div class="bg-layer">
    <img src="https://raw.githubusercontent.com/javauntgarcia/Notion/main/Depop.jpg" alt="" />
  </div>

  <div class="page-content">

    <!-- TOPBAR -->

      <!-- EDIT: BACK LINK -->

<script>
// ── SUPABASE CONFIG ──
const SB_URL = 'https://ghcpmekdumlqrmjruuyn.supabase.co';
const SB_KEY = 'sb_publishable_Am9YxRGdHcF9eIDD032STA_FuyKXaYj';
const IMAGE_BUCKET = 'depop-images'; // EDIT: must exist as a PUBLIC bucket in Supabase Storage

// Wraps fetch with a hard timeout so a blocked/hanging request can never
// leave the page waiting forever with nothing rendered.
function fetchWithTimeout(url, options = {}, ms = 5000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

async function sbGet(table, id) {
  try {
    const r = await fetchWithTimeout(`${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
    const d = await r.json(); return d && d[0] ? d[0] : null;
  } catch(e) { return null; }
}
async function sbUpsert(table, row) {
  try {
    await fetchWithTimeout(`${SB_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify({ ...row, updated_at: new Date().toISOString() })
    });
  } catch(e) {}
}

// ── NEW: image compression + Storage upload (replaces base64-in-row) ──
function compressImage(file, maxWidth = 500, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('compression failed'));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

async function sbUploadImage(blob, filename) {
  try {
    const r = await fetchWithTimeout(`${SB_URL}/storage/v1/object/${IMAGE_BUCKET}/${filename}`, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'image/jpeg'
      },
      body: blob
    }, 15000);
    if (!r.ok) { console.error('Storage upload failed', r.status, await r.text()); return null; }
    return `${SB_URL}/storage/v1/object/public/${IMAGE_BUCKET}/${filename}`;
  } catch(e) { console.error('Storage upload error', e); return null; }
}

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

  /* ---- Date ---- */
  const dateEl = document.getElementById('topbar-date');
  const now = new Date();
  dateEl.textContent = now.toLocaleDateString('en-US', {
    weekday:'short', month:'short', day:'numeric', year:'numeric'
  });

  /* ---- EDIT: LOCALSTORAGE key ---- */
  const STORAGE_KEY = 'dep_items';

  /* ---- State ---- */
  let items = [];
  let pendingImageBlob = null;   // compressed JPEG blob awaiting upload on save
  let pendingImagePreviewUrl = null;
  let formState = { pkg: 'yes', ship: 'no' };

  async function persist() {
    // `items` now only ever contains small text fields + a Storage URL string
    // per image, so this row stays tiny (a few KB) no matter how many items exist.
    await sbUpsert('depop', { id: 'singleton', items });
    lsSet('dep_items', JSON.stringify(items));
  }

  /* ---- EDIT: CHECKLIST RECONCILE — package numbers from your checklist ----
     Matches items already in inventory by name and updates ONLY their
     packaged/pkgCount fields — name/link/image/shipped are left untouched.
     Safe/idempotent to run on every load. Any entry with no match in

  const CHECKLIST_V1 = [

    { match: ["hollister red chinos"],                                           canonical: "Hollister Red Chinos",          pkgCount: 6  },
    { match: [],                                                                 canonical: "Red Plaid Pants",               pkgCount: 7  },
    { match: ["hollister green pants"],                                          canonical: "Hollister Green Pants",         pkgCount: 8  },
    { match: ["banana republic women's pants","banana republic womens pants"],   canonical: "Banana Republic Women's Pants", pkgCount: 9  },
    { match: ["navy plaid pants"],                                               canonical: "Navy Plaid Pants",              pkgCount: 10 },

    { match: ["american eagle flex khakis"],                                     canonical: "American Eagle Flex Khakis",    pkgCount: 14 },
    { match: ["aeropostale skinny khakis"],                                      canonical: "Aeropostale Skinny Khakis",     pkgCount: 15 },
    { match: ["grey denim capris"],                                              canonical: "Grey Denim Capris",             pkgCount: 16 },
    { match: ["plaid skirt"],                                                    canonical: "Plaid Skirt",                   pkgCount: 17 },
    { match: ["vineyard vines swimming trunks"],                                 canonical: "Vineyard Vines Swimming Trunks",pkgCount: 18 },
    { match: ["pink swim trunks"],                                               canonical: "Pink Swim Trunks",              pkgCount: 19 },
    { match: ["red shorts"],                                                     canonical: "Red Shorts",                    pkgCount: 21 },
    { match: ["vintage disco shirt"],                                            canonical: "Vintage Disco Shirt",           pkgCount: 22 },
    { match: ["pink crop top"],                                                  canonical: "Pink Crop Top",                 pkgCount: 23 },
    { match: ["orange flared pants"],                                            canonical: "Orange Flared Pants",           pkgCount: 26 },

    { match: ["onesie"],                                                         canonical: "Onesie",                        pkgCount: 28 },
    { match: ["lavender corduroy"],                                              canonical: "Lavender Corduroy",             pkgCount: 29 }
  ];

  function normalizeName(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function reconcileChecklistV1() {
    const used = new Set();
    CHECKLIST_V1.forEach(entry => {
      const targets = [normalizeName(entry.canonical), ...entry.match.map(normalizeName)];
      const found = items.find(i => !used.has(i.id) && targets.includes(normalizeName(i.name)));
      if (found) {
        found.packaged = true;
        found.pkgCount = entry.pkgCount;
        used.add(found.id);
      } else {
        items.push({
          id: Date.now() + Math.floor(Math.random() * 1000),
          name: entry.canonical,
          link: "",
          packaged: true,
          pkgCount: entry.pkgCount,
          shipped: false,
          image: null
        });
      }
    });
  }

  /* ---- Init ---- */
  (async function() {
    try {
      const row = await sbGet('depop', 'singleton');
      if (row && row.items && row.items.length) { items = row.items; }
      else {
        try { items = JSON.parse(lsGet('dep_items') || '[]'); } catch(e) { items = []; }
        if (items.length === 0) seedNotionData();
      }
      reconcileChecklistV1();
      await persist();
    } catch (e) {
      console.error('Init error, falling back to seed data:', e);
      if (!items || items.length === 0) seedNotionData();
    }
    render();
  })();

  /* ---- Modal ---- */
  function openModal() {
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('input-name').value = '';
    document.getElementById('input-link').value = '';
    document.getElementById('input-pkg-count').value = '1';
    pendingImageBlob = null;
    if (pendingImagePreviewUrl) { URL.revokeObjectURL(pendingImagePreviewUrl); pendingImagePreviewUrl = null; }
    document.getElementById('upload-preview').style.display = 'none';
    document.getElementById('upload-icon').style.display = '';
    document.getElementById('upload-hint').textContent = 'Click to upload';
    formState = { pkg: 'yes', ship: 'no' };
    setToggle('pkg', 'yes');
    setToggle('ship', 'no');
    document.getElementById('input-name').focus();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  function setToggle(group, val) {
    formState[group] = val;
    if (group === 'pkg') {
      document.getElementById('pkg-yes').classList.toggle('active', val === 'yes');
      document.getElementById('pkg-no').classList.toggle('active',  val === 'no');
    } else {
      document.getElementById('ship-yes').classList.toggle('active', val === 'yes');
      document.getElementById('ship-no').classList.toggle('active',  val === 'no');
    }
  }

  /* ---- UPDATED: compress before preview/storage, no more base64-in-row ---- */
  async function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const hint = document.getElementById('upload-hint');
    hint.textContent = 'Compressing…';
    try {
      const compressed = await compressImage(file);
      pendingImageBlob = compressed;
      if (pendingImagePreviewUrl) URL.revokeObjectURL(pendingImagePreviewUrl);
      pendingImagePreviewUrl = URL.createObjectURL(compressed);
      const preview = document.getElementById('upload-preview');
      preview.src = pendingImagePreviewUrl;
      preview.style.display = 'block';
      document.getElementById('upload-icon').style.display = 'none';
      hint.textContent = `Ready · ${(compressed.size / 1024).toFixed(0)}KB`;
    } catch (err) {
      console.error('Image compression failed', err);
      hint.textContent = 'Upload failed — try again';
    }
  }

  /* ---- CRUD ---- */
  /* ---- UPDATED: async — uploads image to Storage before saving the item ---- */
  async function saveItem() {
    const name = document.getElementById('input-name').value.trim();
    if (!name) { document.getElementById('input-name').focus(); return; }

    const saveBtn = document.getElementById('btn-save-item');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    let imageUrl = null;
    if (pendingImageBlob) {
      const filename = `item-${Date.now()}.jpg`;
      imageUrl = await sbUploadImage(pendingImageBlob, filename);
      // if upload fails, imageUrl stays null and the item just saves without a photo
      // rather than falling back to embedding base64 again
    }

    const item = {
      id:       Date.now(),
      name,
      link:     document.getElementById('input-link').value.trim(),
      packaged: formState.pkg === 'yes',
      pkgCount: parseInt(document.getElementById('input-pkg-count').value) || 0,
      shipped:  formState.ship === 'yes',
      image:    imageUrl
    };
    items.push(item);
    await persist();
    render();
    saveBtn.disabled = false;
    saveBtn.textContent = 'Add to Inventory';
    closeModal();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    persist();
    render();
  }

  function togglePackaged(id) {
    const item = items.find(i => i.id === id);
    if (item) { item.packaged = !item.packaged; persist(); render(); }
  }

  function toggleShipped(id) {
    const item = items.find(i => i.id === id);
    if (item) { item.shipped = !item.shipped; persist(); render(); }
  }

  function updatePkgCount(id, val) {
    const item = items.find(i => i.id === id);
    if (item) { item.pkgCount = parseInt(val) || 0; persist(); updateStats(); }
  }

  /* ---- Render ---- */
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render() {
    const active   = items.filter(i => !i.shipped);
    const archived = items.filter(i =>  i.shipped);

    updateStats();

             </svg>

            </svg>
