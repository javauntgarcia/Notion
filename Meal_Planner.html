<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Planner — Javaun Garcia</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --espresso:    #1a0f0a;
      --terra:       #6b3420;
      --terra-lt:    #a05438;
      --mauve:       #8c5e58;
      --mauve-lt:    #b8847c;
      --sand:        #c4a882;
      --sand-lt:     #ddc9a8;
      --ivory:       #f5ede0;
      --glass:         rgba(26,15,10,0.72);
      --glass-border:  rgba(196,168,130,0.22);
      --glass-hover:   rgba(26,15,10,0.86);
      --topbar-bg:     rgba(20,10,6,0.82);
      --surface:       rgba(196,168,130,0.06);
      --surface-hover: rgba(196,168,130,0.11);
      --border:        rgba(196,168,130,0.18);
      --border-focus:  rgba(196,168,130,0.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Mono', monospace; color: var(--ivory); overflow-x: hidden; min-height: 100vh; }

    .bg-image { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: 0; }
    .bg-scrim {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(26,15,10,0.45) 0%, rgba(26,15,10,0.15) 28%, rgba(26,15,10,0.60) 60%, rgba(26,15,10,0.96) 100%);
      z-index: 1;
    }

    /* ── TOPBAR ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 52px;
      background: var(--topbar-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(196,168,130,0.14);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .topbar-nav { display: flex; gap: 24px; }
    .topbar-nav a {
      font-family: 'DM Mono', monospace; font-size: 0.67rem; letter-spacing: 0.13em;
      text-transform: uppercase; color: var(--sand-lt); text-decoration: none;
      opacity: 0.8; transition: opacity 0.2s, color 0.2s;
    }
    .topbar-nav a:hover { opacity: 1; color: var(--ivory); }
    .topbar-date { font-size: 0.63rem; letter-spacing: 0.1em; color: var(--sand); opacity: 0.65; }

    /* ── PAGE ── */
    .page { position: relative; z-index: 10; padding-top: 52px; min-height: 100vh; }
    .hero-block { position: absolute; top: calc(52px + 28px); right: 36px; text-align: right; pointer-events: none; z-index: 20; }
    .hero-title {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 300; line-height: 0.92; color: var(--ivory); text-shadow: 0 2px 32px rgba(26,15,10,0.65);
    }
    .hero-title em { font-style: italic; color: var(--sand-lt); }
    .content { padding: calc(52px + 40px) 28px 80px; max-width: 980px; margin: 0 auto; }

    /* ── TABS ── */
    .tab-nav { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .tab-btn {
      font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.13em;
      text-transform: uppercase; padding: 8px 18px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent; color: var(--sand);
      cursor: pointer; transition: all 0.2s;
    }
    .tab-btn:hover { border-color: var(--border-focus); color: var(--ivory); }
    .tab-btn.active { background: rgba(107,52,32,0.35); border-color: var(--terra-lt); color: var(--ivory); }
    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.28s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    /* ── GLASS CARD ── */
    .glass-card {
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px 22px;
    }
    .section-label { font-size: 0.57rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sand); opacity: 0.6; margin-bottom: 14px; }

    /* ── BUTTONS ── */
    .btn-primary {
      font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--terra); color: var(--ivory); border: none; border-radius: 10px;
      padding: 10px 20px; cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--terra-lt); }
    .btn-ghost {
      font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      background: transparent; color: var(--sand); border: 1px solid rgba(196,168,130,0.28);
      border-radius: 10px; padding: 10px 18px; cursor: pointer; transition: all 0.18s;
    }
    .btn-ghost:hover { border-color: var(--border-focus); color: var(--ivory); }

    /* ══════════ WEEK GRID ══════════ */
    .week-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin-bottom: 16px; }
    @media (max-width: 860px) { .week-grid { grid-template-columns: repeat(4,1fr); } }
    @media (max-width: 520px) { .week-grid { grid-template-columns: repeat(2,1fr); } }

    .day-col { display: flex; flex-direction: column; gap: 6px; }
    .day-header { font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--terra-lt); padding-bottom: 6px; border-bottom: 1px solid rgba(160,84,56,0.28); }

    .meal-slot {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 10px; cursor: pointer;
      transition: all 0.2s; min-height: 68px;
      display: flex; flex-direction: column; gap: 3px; position: relative;
    }
    .meal-slot:hover { border-color: var(--border-focus); background: var(--surface-hover); }
    .meal-slot.has-meal { border-color: rgba(160,84,56,0.35); }
    .meal-slot-type { font-size: 0.52rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--sand); opacity: 0.55; }
    .meal-slot-name {
      font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; font-weight: 400;
      color: var(--ivory); line-height: 1.25;
    }
    .meal-slot-name.empty { color: var(--sand); opacity: 0.3; font-style: italic; font-size: 0.78rem; }

    /* ingredient status bar under meal name */
    .meal-slot-ing-bar {
      display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    .ing-pips { display: flex; gap: 2px; flex-wrap: wrap; }
    .ing-pip {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(196,168,130,0.2);
    }
    .ing-pip.have { background: var(--terra-lt); }
    .ing-pip.need { background: rgba(196,168,130,0.25); border: 1px solid rgba(196,168,130,0.4); }
    .ing-count { font-size: 0.5rem; color: var(--sand); opacity: 0.55; letter-spacing: 0.05em; }

    .meal-slot-del {
      position: absolute; top: 6px; right: 7px;
      background: none; border: none; color: var(--sand); opacity: 0;
      cursor: pointer; font-size: 0.65rem; transition: opacity 0.15s; line-height: 1;
    }
    .meal-slot:hover .meal-slot-del { opacity: 0.45; }
    .meal-slot-del:hover { opacity: 1 !important; color: var(--mauve-lt); }

    .week-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ══════════ SHOPPING LIST ══════════ */
    .shop-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
    .shop-stats { font-size: 0.6rem; color: var(--sand); opacity: 0.55; letter-spacing: 0.08em; }

    /* meal group in shopping list */
    .shop-group { margin-bottom: 18px; }
    .shop-group-label {
      font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--terra-lt); margin-bottom: 6px; padding-bottom: 5px;
      border-bottom: 1px solid rgba(160,84,56,0.2);
      display: flex; align-items: center; gap: 8px;
    }
    .shop-group-day { color: var(--sand); opacity: 0.5; font-size: 0.5rem; }

    .shop-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; border-bottom: 1px solid rgba(196,168,130,0.08);
    }
    .shop-item input[type="checkbox"] { accent-color: var(--terra-lt); cursor: pointer; flex-shrink: 0; }
    .shop-item label { flex: 1; font-size: 0.77rem; color: var(--sand-lt); cursor: pointer; transition: all 0.15s; }
    .shop-item.shop-checked label { text-decoration: line-through; opacity: 0.35; }
    .shop-item .rm { background: none; border: none; color: var(--sand); opacity: 0.25; cursor: pointer; font-size: 0.7rem; transition: opacity 0.15s; }
    .shop-item .rm:hover { opacity: 0.9; color: var(--mauve-lt); }

    .shop-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .shop-cols { grid-template-columns: 1fr; } }

    .input-row { display: flex; gap: 8px; margin-top: 12px; }
    .text-input {
      flex: 1; font-family: 'DM Mono', monospace; font-size: 0.73rem;
      background: rgba(196,168,130,0.07); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 12px; color: var(--ivory);
      outline: none; transition: border-color 0.2s;
    }
    .text-input:focus { border-color: var(--border-focus); }
    .text-input::placeholder { color: rgba(196,168,130,0.3); }
    .empty-note { font-size: 0.7rem; color: var(--sand); opacity: 0.35; font-style: italic; padding: 6px 0; }

    /* ══════════ RECIPE VAULT ══════════ */
    .vault-top { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 160px; }
    .search-wrap::before { content: '⌕'; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--sand); opacity: 0.5; font-size: 1rem; pointer-events: none; }
    .search-wrap input { width: 100%; padding-left: 30px; }

    .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      font-family: 'DM Mono', monospace; font-size: 0.57rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--sand); cursor: pointer; transition: all 0.18s;
    }
    .pill:hover, .pill.active { border-color: var(--terra-lt); background: rgba(107,52,32,0.28); color: var(--ivory); }

    .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px,1fr)); gap: 10px; }
    .recipe-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; transition: all 0.2s;
    }
    .recipe-card:hover { border-color: rgba(160,84,56,0.4); background: var(--glass-hover); }
    .recipe-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .recipe-name { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 400; color: var(--ivory); line-height: 1.2; }
    .type-tag { font-size: 0.52rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; background: rgba(107,52,32,0.3); color: var(--terra-lt); border: 1px solid rgba(160,84,56,0.3); }
    .recipe-ingredients { font-size: 0.7rem; color: var(--sand); opacity: 0.8; line-height: 1.65; }
    .recipe-notes { font-size: 0.68rem; color: var(--sand); opacity: 0.6; font-style: italic; }
    .recipe-url { font-size: 0.65rem; color: var(--mauve-lt); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
    .recipe-url:hover { text-decoration: underline; color: var(--sand-lt); }
    .recipe-actions { display: flex; gap: 7px; margin-top: 4px; }
    .recipe-actions button { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 11px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .btn-edit { background: none; border: 1px solid var(--border); color: var(--sand); }
    .btn-edit:hover { border-color: var(--border-focus); color: var(--ivory); }
    .btn-del { background: none; border: 1px solid rgba(140,94,88,0.3); color: rgba(184,132,124,0.65); }
    .btn-del:hover { background: rgba(140,94,88,0.15); color: var(--mauve-lt); }
    .empty-vault { text-align: center; padding: 42px 20px; grid-column: 1/-1; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; color: var(--sand); opacity: 0.35; }

    /* ══════════ MEAL DETAIL MODAL ══════════ */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(20,8,4,0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 400; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: rgba(22,10,6,0.98); border: 1px solid rgba(196,168,130,0.28);
      border-radius: 22px; padding: 28px 26px; width: 100%; max-width: 520px;
      max-height: 90vh; overflow-y: auto; animation: slideUp 0.22s ease both;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .modal-close { float: right; background: none; border: none; color: var(--sand); font-size: 1.1rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; line-height: 1; }
    .modal-close:hover { opacity: 1; }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem; font-weight: 300; color: var(--ivory); margin-bottom: 6px; clear: both; }
    .modal-title em { font-style: italic; color: var(--sand-lt); }
    .modal-subtitle { font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--terra-lt); margin-bottom: 20px; }

    .field-group { margin-bottom: 14px; }
    .field-label { font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sand); opacity: 0.6; margin-bottom: 6px; }
    .modal input[type=text], .modal select, .modal textarea {
      width: 100%; font-family: 'DM Mono', monospace; font-size: 0.72rem;
      background: rgba(196,168,130,0.06); border: 1px solid rgba(196,168,130,0.2);
      border-radius: 9px; padding: 9px 12px; color: var(--ivory); outline: none; transition: border-color 0.2s;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: rgba(196,168,130,0.45); }
    .modal input::placeholder, .modal textarea::placeholder { color: rgba(196,168,130,0.28); }
    .modal select option { background: #1a0f0a; }
    .modal textarea { resize: vertical; min-height: 70px; line-height: 1.65; }

    /* ingredient checklist in meal detail modal */
    .ing-checklist { margin-top: 4px; max-height: 220px; overflow-y: auto; }
    .ing-check-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px; transition: background 0.12s;
    }
    .ing-check-row:hover { background: rgba(196,168,130,0.06); }
    .ing-check-row input[type=checkbox] { accent-color: var(--terra-lt); cursor: pointer; flex-shrink: 0; width: 15px; height: 15px; }
    .ing-check-row label { flex: 1; font-size: 0.75rem; color: var(--sand-lt); cursor: pointer; transition: all 0.15s; }
    .ing-check-row.ing-have label { text-decoration: line-through; color: var(--sand); opacity: 0.42; }
    .ing-check-row .del-ing { background: none; border: none; color: var(--sand); opacity: 0.2; cursor: pointer; font-size: 0.68rem; transition: opacity 0.15s; }
    .ing-check-row:hover .del-ing { opacity: 0.5; }
    .ing-check-row .del-ing:hover { opacity: 1; color: var(--mauve-lt); }

    .add-ing-row { display: flex; gap: 7px; margin-top: 10px; }
    .add-ing-input { flex: 1; font-family: 'DM Mono', monospace; font-size: 0.72rem; background: rgba(196,168,130,0.06); border: 1px solid rgba(196,168,130,0.2); border-radius: 9px; padding: 8px 12px; color: var(--ivory); outline: none; transition: border-color 0.2s; }
    .add-ing-input:focus { border-color: rgba(196,168,130,0.45); }
    .add-ing-input::placeholder { color: rgba(196,168,130,0.28); }
    .btn-add-ing { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(107,52,32,0.5); border: 1px solid rgba(160,84,56,0.4); color: var(--sand-lt); border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .btn-add-ing:hover { background: rgba(107,52,32,0.75); color: var(--ivory); }

    /* need badge next to ingredient count */
    .need-badge { font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(107,52,32,0.5); color: var(--terra-lt); border: 1px solid rgba(160,84,56,0.35); border-radius: 4px; padding: 2px 6px; }

    /* vault picker section in meal modal */
    .picker-section-label { font-size: 0.54rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sand); opacity: 0.5; margin: 14px 0 6px; }
    .picker-list { max-height: 150px; overflow-y: auto; margin-bottom: 4px; }
    .picker-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 11px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 4px; cursor: pointer; transition: all 0.15s; }
    .picker-item:hover { border-color: var(--terra-lt); background: rgba(107,52,32,0.2); }
    .picker-item span { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; color: var(--ivory); }
    .picker-item small { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sand); opacity: 0.55; }

    .modal-actions { display: flex; gap: 9px; margin-top: 20px; }
    .modal-actions .btn-primary { flex: 1; }

    /* recipe modal */
    .modal-wide { max-width: 480px; }

    /* save dot */
    .save-dot { position: fixed; bottom: 20px; right: 20px; width: 7px; height: 7px; border-radius: 50%; background: var(--terra-lt); z-index: 300; opacity: 0; transition: opacity 0.3s; }
    .save-dot.show { opacity: 1; }

    /* toast */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: rgba(107,52,32,0.92); border: 1px solid var(--terra-lt); color: var(--ivory); padding: 8px 22px; font-size: 0.68rem; letter-spacing: 0.08em; border-radius: 10px; z-index: 500; pointer-events: none; white-space: nowrap; animation: toastIn 0.2s ease; }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(196,168,130,0.2); border-radius: 4px; }
  </style>
</head>
<body>

<img class="bg-image" src="https://raw.githubusercontent.com/javauntgarcia/Notion/main/meal.jpg" alt="" />
<div class="bg-scrim"></div>

<nav class="topbar">
  <div class="topbar-nav">
    <a href="Planning.html">← Planning</a>
    <a href="Main_Hub.html">Main Hub</a>
  </div>
  <div class="topbar-date" id="topbarDate"></div>
  <div class="topbar-nav">
    <a href="Monthly_Outline.html">Monthly Outline</a>
    <a href="Wellness.html">Wellness</a>
  </div>
</nav>

<div class="page">
  <div class="hero-block">
    <div class="hero-title">Meal <em>Planner</em></div>
  </div>

  <div class="content">
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="weekly">Weekly</button>
      <button class="tab-btn" data-tab="shopping">Shopping List</button>
      <button class="tab-btn" data-tab="vault">Recipe Vault</button>
    </div>

    <!-- ══ WEEKLY PLANNER ══ -->
    <div id="tab-weekly" class="panel active">
      <div class="glass-card" style="margin-bottom:14px">
        <div class="section-label">Week of <span id="weekOfLabel"></span></div>
        <div class="week-grid" id="weekGrid"></div>
        <div class="week-actions" style="margin-top:16px">
          <button class="btn-primary" onclick="switchToShopping()">→ View Shopping List</button>
          <button class="btn-ghost" onclick="syncToCalendar()">↑ Sync to Monthly Outline</button>
          <button class="btn-ghost" onclick="newWeek()">↺ New Week</button>
          <button class="btn-ghost" onclick="clearWeek()">✕ Clear Week</button>
        </div>
      </div>
    </div>

    <!-- ══ SHOPPING LIST ══ -->
    <div id="tab-shopping" class="panel">
      <div class="shop-cols">
        <div class="glass-card">
          <div class="shop-header">
            <div class="section-label" style="margin-bottom:0">Need to Buy</div>
            <div class="shop-stats" id="shopStats"></div>
          </div>
          <div id="autoItems"></div>
        </div>
        <div class="glass-card">
          <div class="section-label">Additional Items</div>
          <div id="manualItems"></div>
          <div class="input-row">
            <input id="manualInput" class="text-input" placeholder="Add extra item…" />
            <button class="btn-primary" style="white-space:nowrap" onclick="addManual()">Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ RECIPE VAULT ══ -->
    <div id="tab-vault" class="panel">
      <div class="vault-top">
        <div class="search-wrap">
          <input id="vaultSearch" class="text-input" placeholder="Search name or ingredient…" oninput="renderVault()" />
        </div>
        <div class="filter-pills">
          <button class="pill active" onclick="setFilter('all',this)">All</button>
          <button class="pill" onclick="setFilter('breakfast',this)">Breakfast</button>
          <button class="pill" onclick="setFilter('lunch',this)">Lunch</button>

</div>

<div class="modal-overlay" id="recipeModal">

<div class="save-dot" id="saveDot"></div>

<script>
// ─── SUPABASE ───────────────────────────────────────────────────────────
const SB_URL = 'https://ghcpmekdumlqrmjruuyn.supabase.co';
const SB_KEY = 'sb_publishable_Am9YxRGdHcF9eIDD032STA_FuyKXaYj';
async function sbGet(table, id) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
    const d = await r.json(); return d && d[0] ? d[0] : null;
  } catch(e) { return null; }
}
async function sbUpsert(table, row) {
  try {
    await fetch(`${SB_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify({ ...row, updated_at: new Date().toISOString() })
    });
  } catch(e) {}
}
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

// ─── STATE ──────────────────────────────────────────────────────────────
/*
  state.week[key] = {
    name: string,
    recipeId?: string,
    ingredients: [{ text: string, have: boolean }],
    notes?: string,
    url?: string
  }
*/
let state = {
  week: {},
  recipes: [],
  shopping: { manual: [] }   // auto is derived on-the-fly from week
};

const DAYS  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SLOTS = ['Breakfast','Lunch','Dinner','Snack'];

let vaultFilter  = 'all';
let editingId    = null;   // recipe vault editing
let mealTarget   = null;   // { day, slot, key } currently open in mealModal
let modalIngredients = []; // local working copy while modal is open

// ─── INIT ───────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const today = new Date();
  document.getElementById('topbarDate').textContent =
    today.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});

  const dow = today.getDay();
  const monday = new Date(today); monday.setDate(today.getDate() - ((dow + 6) % 7));
  document.getElementById('weekOfLabel').textContent =
    monday.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

  const row = await sbGet('meal_planner','singleton');
  if (row) {
    state.week     = row.week     || {};
    state.recipes  = row.recipes  || [];
    state.shopping = row.shopping || { manual: [] };
  } else {
    try { const s = lsGet('mp_state'); if (s) Object.assign(state, JSON.parse(s)); } catch(e) {}
  }

  renderWeek();
  renderVault();
  renderShopping();
});

async function saveState() {
  const dot = document.getElementById('saveDot');
  dot.classList.add('show');
  clearTimeout(dot._t);
  dot._t = setTimeout(() => dot.classList.remove('show'), 1400);
  await sbUpsert('meal_planner', { id: 'singleton', ...state });
  lsSet('mp_state', JSON.stringify(state));
}

// ─── TABS ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'shopping') renderShopping();
  });
});

function switchToShopping() {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="shopping"]').classList.add('active');
  document.getElementById('tab-shopping').classList.add('active');
  renderShopping();
}

// ─── WEEK GRID ───────────────────────────────────────────────────────────
function renderWeek() {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  DAYS.forEach(day => {
    const col = document.createElement('div');
    col.className = 'day-col';
    col.innerHTML = `<div class="day-header">${day.slice(0,3)}</div>`;
    SLOTS.forEach(slot => {
      const key  = `${day}-${slot}`;
      const meal = state.week[key];
      const div  = document.createElement('div');
      div.className = 'meal-slot' + (meal ? ' has-meal' : '');

      let innerHtml = `<span class="meal-slot-type">${slot}</span>`;

      if (meal) {
        innerHtml += `<span class="meal-slot-name">${esc(meal.name)}</span>`;
        // ingredient status pips
        const ings = meal.ingredients || [];
        if (ings.length) {
          const have = ings.filter(i => i.have).length;
          const need = ings.length - have;
          const pips = ings.slice(0,8).map(i =>
            `<div class="ing-pip ${i.have ? 'have' : 'need'}"></div>`
          ).join('');
          innerHtml += `
            <div class="meal-slot-ing-bar">
              <div class="ing-pips">${pips}</div>
              ${need > 0 ? `<span class="ing-count">${need} needed</span>` : `<span class="ing-count" style="color:var(--terra-lt)">✓ all set</span>`}
            </div>`;
        }
        innerHtml += `<button class="meal-slot-del" onclick="removeMeal('${key}',event)" title="Remove">✕</button>`;
      } else {
        innerHtml += `<span class="meal-slot-name empty">+ add meal</span>`;
      }

      div.innerHTML = innerHtml;
      div.addEventListener('click', () => openMealModal(day, slot));
      col.appendChild(div);
    });
    grid.appendChild(col);
  });
}

function removeMeal(key, e) {
  e.stopPropagation();
  delete state.week[key];
  saveState(); renderWeek(); renderShopping();
}

function clearWeek() {
  if (!confirm('Remove all meals from the week? Ingredient lists will be lost.')) return;
  state.week = {}; saveState(); renderWeek(); renderShopping();
  toast('Week cleared');
}

// "New Week" keeps every meal and its ingredient list, but resets all
// have=true flags back to false so you start fresh for shopping each week.
function newWeek() {
  if (!confirm('Start a new week? Meals stay, but all ingredient checks will reset to unchecked.')) return;
  Object.values(state.week).forEach(meal => {
    if (meal.ingredients) {
      meal.ingredients = meal.ingredients.map(ing => ({ text: ing.text, have: false }));
    }
  });
  if (state.shopping && state.shopping.manual) {
    state.shopping.manual = state.shopping.manual.map(i => ({ text: i.text, checked: false }));
  }
  saveState(); renderWeek(); renderShopping();
  toast('New week started — all ingredient checks reset');
}

// ─── MEAL DETAIL MODAL ───────────────────────────────────────────────────
function openMealModal(day, slot) {
  const key  = `${day}-${slot}`;
  const meal = state.week[key] || null;
  mealTarget = { day, slot, key };

  document.getElementById('mealModalTitle').innerHTML = meal ? `Edit <em>Meal</em>` : `Add <em>Meal</em>`;
  document.getElementById('mealModalSubtitle').textContent = `${day} · ${slot}`;
  document.getElementById('mealName').value  = meal ? meal.name  : '';
  document.getElementById('mealNotes').value = meal ? (meal.notes || '') : '';
  document.getElementById('mealUrl').value   = meal ? (meal.url   || '') : '';

  // Working copy of ingredients
  modalIngredients = meal ? meal.ingredients.map(i => ({...i})) : [];

  renderModalIngredients();
  renderVaultPicker();
  document.getElementById('newIngInput').value = '';
  document.getElementById('mealModal').classList.add('open');
  setTimeout(() => document.getElementById('mealName').focus(), 80);
}

function closeMealModal() {
  document.getElementById('mealModal').classList.remove('open');
  mealTarget = null;
  modalIngredients = [];
}

// Render the ingredient checklist inside the modal
function renderModalIngredients() {
  const list = document.getElementById('ingChecklist');
  const label = document.getElementById('ingStatusLabel');

  if (!modalIngredients.length) {
    list.innerHTML = '<p style="font-size:0.7rem;color:var(--sand);opacity:0.35;padding:6px 0;font-style:italic">No ingredients yet — add below</p>';
    label.innerHTML = '';
    return;
  }

  const have = modalIngredients.filter(i => i.have).length;
  const need = modalIngredients.length - have;
  label.innerHTML = need > 0
    ? `<span class="need-badge">${need} to buy</span>`
    : `<span style="font-size:0.55rem;color:var(--terra-lt);letter-spacing:0.1em">✓ all stocked</span>`;

  list.innerHTML = modalIngredients.map((ing, idx) => `
    <div class="ing-check-row ${ing.have ? 'ing-have' : ''}">
      <input type="checkbox" id="ming-${idx}" ${ing.have ? 'checked' : ''}
        onchange="toggleModalIng(${idx})" />
      <label for="ming-${idx}">${esc(ing.text)}</label>
      <button class="del-ing" onclick="removeModalIng(${idx})">✕</button>
    </div>`).join('');
}

function toggleModalIng(idx) {
  modalIngredients[idx].have = !modalIngredients[idx].have;
  renderModalIngredients();
}

function removeModalIng(idx) {
  modalIngredients.splice(idx, 1);
  renderModalIngredients();
}

function addIngredientToModal() {
  const val = document.getElementById('newIngInput').value.trim();
  if (!val) return;
  modalIngredients.push({ text: val, have: false });
  document.getElementById('newIngInput').value = '';
  renderModalIngredients();
  document.getElementById('newIngInput').focus();
}

document.getElementById('newIngInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addIngredientToModal();
});

// Vault picker inside meal modal: clicking a recipe pre-fills name + ingredients
function renderVaultPicker() {
  const list = document.getElementById('mealVaultPicker');
  if (!state.recipes.length) {
    list.innerHTML = '<p style="font-size:0.68rem;color:var(--sand);opacity:0.35;padding:4px 0;font-style:italic">No saved recipes yet.</p>';
    return;
  }
  list.innerHTML = state.recipes.map(r => `
    <div class="picker-item" onclick="loadFromVault('${r.id}')">
      <span>${esc(r.name)}</span>
      <small>${r.type}</small>
    </div>`).join('');
}

function loadFromVault(recipeId) {
  const r = state.recipes.find(x => x.id === recipeId);
  if (!r) return;
  document.getElementById('mealName').value  = r.name;
  document.getElementById('mealNotes').value = r.notes || '';
  document.getElementById('mealUrl').value   = r.url   || '';
  // Vault loads always start fully unchecked — the recipe template never carries "have" state.
  // The ingredient list is the template; checked state is per-week-session only.
  modalIngredients = r.ingredients.map(text => ({ text, have: false }));
  renderModalIngredients();
  toast(`Loaded: ${r.name}`);
}

function saveMealSlot() {
  const name = document.getElementById('mealName').value.trim();
  if (!name || !mealTarget) { document.getElementById('mealName').focus(); return; }
  state.week[mealTarget.key] = {
    name,
    ingredients: [...modalIngredients],
    notes: document.getElementById('mealNotes').value.trim(),
    url:   document.getElementById('mealUrl').value.trim(),
  };
  saveState(); renderWeek(); renderShopping(); closeMealModal();
  toast(`Saved: ${name}`);
}

// ─── SHOPPING LIST ───────────────────────────────────────────────────────
/*
  Auto items are derived live from state.week:
  any ingredient where have === false becomes a shopping list item,
  grouped by meal name + day/slot label.
  Checking off in the shopping list updates the week's ingredient.have.
*/

function getNeededIngredients() {
  // Returns array of { group: "Mon · Dinner — Lemon Salmon", items: [{slotKey, ingIdx, text, bought}] }
  const groups = [];
  DAYS.forEach(day => {
    SLOTS.forEach(slot => {
      const key  = `${day}-${slot}`;
      const meal = state.week[key];
      if (!meal) return;
      const needed = (meal.ingredients || [])
        .map((ing, idx) => ({ slotKey: key, ingIdx: idx, text: ing.text, bought: ing.have }))
        .filter(i => !i.bought);
      if (needed.length) {
        groups.push({
          group: meal.name,
          label: `${day.slice(0,3)} · ${slot}`,
          items: needed
        });
      }
    });
  });
  return groups;
}

function renderShopping() {
  const groups = getNeededIngredients();
  const autoEl = document.getElementById('autoItems');
  const statsEl = document.getElementById('shopStats');

  const totalNeeded = groups.reduce((s,g) => s + g.items.length, 0);
  statsEl.textContent = totalNeeded ? `${totalNeeded} item${totalNeeded !== 1 ? 's' : ''} needed` : 'All stocked ✓';

  if (!groups.length) {
    autoEl.innerHTML = '<p class="empty-note">All ingredients are stocked, or no meals planned yet.</p>';
  } else {
    autoEl.innerHTML = groups.map((g, gi) => `
      <div class="shop-group">
        <div class="shop-group-label">
          ${esc(g.group)}
          <span class="shop-group-day">${g.label}</span>
        </div>
        ${g.items.map((item, ii) => `
          <div class="shop-item" id="auto-${gi}-${ii}">
            <input type="checkbox" id="ach-${gi}-${ii}"
              onchange="markIngHave('${item.slotKey}', ${item.ingIdx}, this.checked)" />
            <label for="ach-${gi}-${ii}">${esc(item.text)}</label>
          </div>`).join('')}
      </div>`).join('');
  }

  // Manual items
  renderManualItems();
}

// Checking an ingredient in shopping list marks it as "have" in the week state
function markIngHave(slotKey, ingIdx, checked) {
  const meal = state.week[slotKey];
  if (!meal || !meal.ingredients[ingIdx]) return;
  meal.ingredients[ingIdx].have = checked;
  saveState();
  // Re-render after brief delay so checkbox animation completes
  setTimeout(() => { renderShopping(); renderWeek(); }, 300);
}

function renderManualItems() {
  const el = document.getElementById('manualItems');
  const items = state.shopping.manual || [];
  if (!items.length) {
    el.innerHTML = '<p class="empty-note">No extra items yet.</p>';
    return;
  }
  el.innerHTML = items.map((item, i) => `
    <div class="shop-item${item.checked ? ' shop-checked' : ''}">
      <input type="checkbox" id="man-${i}" ${item.checked ? 'checked' : ''} onchange="toggleManual(${i})">
      <label for="man-${i}">${esc(item.text)}</label>
      <button class="rm" onclick="removeManual(${i})">✕</button>
    </div>`).join('');
}

function toggleManual(i) {
  state.shopping.manual[i].checked = !state.shopping.manual[i].checked;
  saveState(); renderManualItems();
}
function removeManual(i) {
  state.shopping.manual.splice(i, 1);
  saveState(); renderManualItems();
}
function addManual() {
  const v = document.getElementById('manualInput').value.trim();
  if (!v) return;
  if (!state.shopping.manual) state.shopping.manual = [];
  state.shopping.manual.push({ text: v, checked: false });
  document.getElementById('manualInput').value = '';
  saveState(); renderManualItems();
}
document.getElementById('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addManual();
});

// ─── RECIPE VAULT ────────────────────────────────────────────────────────
function setFilter(f, btn) {
  vaultFilter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderVault();
}
function renderVault() {
  const q    = (document.getElementById('vaultSearch').value || '').toLowerCase();
  const grid = document.getElementById('recipeGrid');
  const filtered = state.recipes.filter(r => {
    const matchType = vaultFilter === 'all' || r.type === vaultFilter;
    const matchQ    = !q || r.name.toLowerCase().includes(q) ||
                      r.ingredients.some(i => i.toLowerCase().includes(q)) ||
                      (r.notes || '').toLowerCase().includes(q);
    return matchType && matchQ;
  });
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-vault">No recipes found. Add one above ↑</div>';
    return;
  }
  grid.innerHTML = filtered.map(r => `
    <div class="recipe-card">
      <div class="recipe-card-top">
        <span class="recipe-name">${esc(r.name)}</span>
        <span class="type-tag">${r.type}</span>
      </div>
      <div class="recipe-ingredients">${r.ingredients.slice(0,7).map(esc).join(' · ')}${r.ingredients.length > 7 ? ' …' : ''}</div>
      ${r.notes ? `<div class="recipe-notes">${esc(r.notes)}</div>` : ''}
      ${r.url ? `<a class="recipe-url" href="${r.url}" target="_blank" rel="noopener">↗ Recipe / Video</a>` : ''}
      <div class="recipe-actions">
        <button class="btn-edit" onclick="openRecipeModal('${r.id}')">Edit</button>
        <button class="btn-del" onclick="deleteRecipe('${r.id}')">Delete</button>
      </div>
    </div>`).join('');
}

function openRecipeModal(id) {
  editingId = id || null;
  document.getElementById('recipeModalTitle').innerHTML = id ? 'Edit <em>Recipe</em>' : 'New <em>Recipe</em>';
  if (id) {
    const r = state.recipes.find(x => x.id === id);
    document.getElementById('rName').value        = r.name;
    document.getElementById('rType').value        = r.type;
    document.getElementById('rIngredients').value = r.ingredients.join('\n');
    document.getElementById('rNotes').value       = r.notes || '';
    document.getElementById('rUrl').value         = r.url   || '';
  } else {
    ['rName','rIngredients','rNotes','rUrl'].forEach(k => document.getElementById(k).value = '');
    document.getElementById('rType').value = 'dinner';
  }
  document.getElementById('recipeModal').classList.add('open');
  setTimeout(() => document.getElementById('rName').focus(), 80);
}
function closeRecipeModal() {
  document.getElementById('recipeModal').classList.remove('open');
  editingId = null;
}
function saveRecipe() {
  const name = document.getElementById('rName').value.trim();
  if (!name) { document.getElementById('rName').focus(); return; }
  const recipe = {
    id:          editingId || `r${Date.now()}`,
    name,
    type:        document.getElementById('rType').value,
    ingredients: document.getElementById('rIngredients').value.split('\n').map(s => s.trim()).filter(Boolean),
    notes:       document.getElementById('rNotes').value.trim(),
    url:         document.getElementById('rUrl').value.trim(),
  };
  if (editingId) {
    const i = state.recipes.findIndex(r => r.id === editingId);
    if (i > -1) state.recipes[i] = recipe; else state.recipes.unshift(recipe);
  } else {
    state.recipes.unshift(recipe);
  }
  saveState(); closeRecipeModal(); renderVault();
  toast(editingId ? 'Recipe updated' : 'Recipe saved!');
}
function deleteRecipe(id) {
  if (!confirm('Delete this recipe?')) return;
  state.recipes = state.recipes.filter(r => r.id !== id);
  saveState(); renderVault();
  toast('Recipe deleted');
}

// ─── SYNC TO MONTHLY OUTLINE ─────────────────────────────────────────────
async function syncToCalendar() {
  const mo = await sbGet('monthly_outline','singleton') || {};
  const events = mo.cal_events || [];
  const today  = new Date();
  const dow    = today.getDay();
  const monday = new Date(today); monday.setDate(today.getDate() - ((dow + 6) % 7));

  const weekDates = DAYS.map((_, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  });

  const cleaned = events.filter(ev => !(ev.cat === 'meals' && weekDates.includes(ev.date)));
  const newEvents = [];
  DAYS.forEach((day, di) => {
    const ds = weekDates[di];
    SLOTS.forEach(slot => {
      const meal = state.week[`${day}-${slot}`];
      if (meal) {
        newEvents.push({ id: `meal_${ds}_${slot.toLowerCase()}_${Date.now()}`, title: `${slot}: ${meal.name}`, date: ds, cat: 'meals', start: '', end: '', notes: meal.notes || '' });
      }
    });
  });

  mo.cal_events = [...cleaned, ...newEvents];
  await sbUpsert('monthly_outline', { id: 'singleton', ...mo });
  toast(`Synced ${newEvents.length} meal${newEvents.length !== 1 ? 's' : ''} to Monthly Outline!`);
}

// ─── UTILS ───────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

// Close modals on overlay click
document.getElementById('mealModal').addEventListener('click', function(e) { if (e.target === this) closeMealModal(); });
document.getElementById('recipeModal').addEventListener('click', function(e) { if (e.target === this) closeRecipeModal(); });
</script>
