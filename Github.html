<!DOCTYPE html>
<html lang="en">
<head>
<!--
  ============================================================
  GITHUB GUIDE — Edit Templates
  ============================================================
  GitHub Pages URL:
    https://javauntgarcia.github.io/Notion/Github.html

  This page replaced Notion_Guide.html (2026-09-04) — Javaun no
  longer edits these dashboards through Notion, only directly on
  GitHub, so every tab below is a copy-paste template for asking
  Claude to change a file's code and get it back onto GitHub.

  EDIT GUIDE — search these strings to find each section:
    Palette / colors   →  :root {
    Background image   →  EDIT: background image URL
    Overlay tint       →  EDIT: overlay gradient
    Tab labels         →  EDIT: tab names
    Template content   →  EDIT: template text
    localStorage keys  →  gh_prompt_
  ============================================================
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitHub Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   EDIT: Color palette — derived from Notion_Design.jpg
   Actual image tones: deep black, warm amber/gold ochre,
   rich dark brown, cream/milk white, crimson-red bead accents.
   ============================================================ */
:root {
  --primary:        #1a1108;        /* deep amber-black */
  --primary-mid:    #2c1e0a;        /* dark warm brown */
  --accent:         #c8882a;        /* amber gold */
  --highlight:      #e8b96a;        /* warm ochre/gold */
  --warm-white:     #f5ead8;        /* cream */
  --ivory:          #faf3e8;        /* near ivory */
  --crimson:        #9e2b2b;        /* bead red accent */
  --glass:          rgba(200, 136, 42, 0.10);
  --glass-hover:    rgba(200, 136, 42, 0.18);
  --glass-b:        rgba(232, 185, 106, 0.26);
  --tab-active-bg:  rgba(200, 136, 42, 0.20);
  --tab-active-b:   rgba(232, 185, 106, 0.55);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Mono', monospace;
  background: var(--primary);
  color: var(--warm-white);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- PAGE WRAP ---- */
.page-wrap {
  position: relative;
  min-height: 100vh;
}

/* ---- BACKGROUND ---- */
/* EDIT: background image URL — change filename after /main/ */
.bg-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}
.bg-layer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
/* EDIT: overlay gradient — tinted to image dominant colors */
.bg-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    175deg,
    rgba(14, 9, 2, 0.80) 0%,
    rgba(28, 16, 4, 0.65) 45%,
    rgba(22, 12, 3, 0.75) 100%
  );
  z-index: 1;
}

/* ---- TOPBAR ---- */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 48px;
  background: rgba(14, 9, 2, 0.42);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(232, 185, 106, 0.10);
}
.topbar-back {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.85;
  transition: opacity 0.2s;
}
.topbar-back:hover { opacity: 1; }
.topbar-date {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--highlight);
  opacity: 0.50;
  letter-spacing: 0.08em;
}

/* ---- CONTENT LAYER ---- */
.content { position: relative; z-index: 1; }

/* ---- MASTHEAD ---- */
.masthead {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6rem 1rem 4rem;
}
.eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.2rem;
  opacity: 0.9;
}
.masthead h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3.5rem, 10vw, 6.5rem);
  font-weight: 700;
  line-height: 1.0;
  color: var(--warm-white);
  letter-spacing: -0.01em;
}
.masthead h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--highlight);
}
.tagline { display: none; }

/* scroll cue */
.scroll-cue {
  margin-top: 3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  animation: bob 1.8s ease-in-out infinite;
  color: var(--accent);
  opacity: 0.6;
}
.scroll-cue span {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* ---- DIVIDER ---- */
.divider {
  height: 1px;
  width: 100%;
  background: linear-gradient(
    to right,
    transparent,
    rgba(200, 136, 42, 0.18),
    transparent
  );
}

/* ---- SECTIONS ---- */
.section {
  padding: 5rem 1.5rem 5rem;
  max-width: 880px;
  margin: 0 auto;
  animation: fadeUp 0.8s ease both;
}
.section:nth-of-type(1) { animation-delay: 0.1s; }
.section:nth-of-type(2) { animation-delay: 0.2s; }

.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.75;
  margin-bottom: 1.6rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label svg { opacity: 0.8; flex-shrink: 0; }
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, rgba(200,136,42,0.20), transparent);
}

/* ---- GLASS CARD ---- */
.glass-card {
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-b);
  border-radius: 14px;
  padding: 1.8rem 2rem;
}

/* ---- TABS ---- */
.tab-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 1.6rem;
}
/* EDIT: tab names are on the button elements below */
.tab-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(200,136,42,0.07);
  border: 1px solid rgba(200,136,42,0.22);
  border-radius: 99px;
  padding: 0.46em 1.15em;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  outline: none;
  white-space: nowrap;
}
.tab-btn:hover {
  background: rgba(200,136,42,0.15);
  border-color: rgba(232,185,106,0.40);
}
.tab-btn.active {
  background: var(--tab-active-bg);
  border-color: var(--tab-active-b);
  color: var(--highlight);
}

/* ---- PROMPT PANE ---- */
.prompt-pane { display: none; }
.prompt-pane.active { display: block; }

.prompt-pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.9rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.prompt-pane-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--warm-white);
  letter-spacing: 0.01em;
}
.btn-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* Pill button */
.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(200,136,42,0.10);
  border: 1px solid rgba(200,136,42,0.30);
  border-radius: 99px;
  padding: 0.44em 1.05em;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  outline: none;
}
.pill-btn:hover {
  background: rgba(200,136,42,0.20);
  border-color: rgba(232,185,106,0.45);
}
.pill-btn.flash {
  color: var(--highlight);
  border-color: var(--highlight);
}

/* Textarea */
.prompt-textarea {
  width: 100%;
  min-height: 360px;
  background: rgba(14, 9, 2, 0.50);
  border: 1px solid rgba(200,136,42,0.18);
  border-radius: 10px;
  color: var(--warm-white);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  line-height: 1.78;
  padding: 1.1rem 1.2rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 0.01em;
}
.prompt-textarea:focus {
  border-color: rgba(232,185,106,0.42);
}
.prompt-textarea::placeholder {
  color: rgba(200,136,42,0.30);
}

/* save status */
.save-status {
  font-family: 'DM Mono', monospace;
  font-size: 0.57rem;
  letter-spacing: 0.18em;
  color: var(--highlight);
  opacity: 0;
  text-transform: uppercase;
  transition: opacity 0.3s;
  margin-top: 0.55rem;
  text-align: right;
}
.save-status.visible { opacity: 0.65; }

/* copy toast */
.copy-toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(26, 16, 4, 0.93);
  border: 1px solid var(--glass-b);
  border-radius: 99px;
  padding: 0.52em 1.5em;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--highlight);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 0.3s, transform 0.3s;
}
.copy-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---- FOOTER ---- */
footer {
  text-align: center;
  padding: 2.5rem 1rem 3rem;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.8rem;
  color: var(--accent);
  opacity: 0.35;
  position: relative;
  z-index: 1;
}

/* ---- ANIMATIONS ---- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(6px); }
}

/* ---- RESPONSIVE ---- */
@media (max-width: 600px) {
  .topbar { padding: 0 1rem; }
  .glass-card { padding: 1.4rem 1.2rem; }
  .tab-btn { font-size: 0.55rem; padding: 0.42em 0.9em; }
  .prompt-textarea { min-height: 280px; font-size: 0.68rem; }
}
</style>
</head>

<div class="page-wrap">

        </svg>

      </p>

      <div class="glass-card">

        <!-- EDIT: tab names — data-tab must match the pane id suffix -->
        <div class="tab-bar" role="tablist" aria-label="Page prompts">

                Save

          <textarea class="prompt-textarea" id="textarea-main-hub" placeholder="Paste your Main Hub Claude prompt here — saves on blur or via Save button." spellcheck="false"></textarea>

        <!-- ── TAB: Productivity ── -->

                Copy

        <!-- ── TAB: Planning ── -->

          <div class="prompt-pane-header">
            <span class="prompt-pane-title">Planning</span>

    btn.setAttribute('aria-selected', 'true');
    var pane = document.getElementById('pane-' + tabId);
    if (pane) pane.classList.add('active');
  });
});

// ---- Save prompt ----
function savePrompt(id) {
  var ta = document.getElementById('textarea-' + id);
  var st = document.getElementById('status-' + id);
  if (!ta) return;
  try { localStorage.setItem(PREFIX + id, ta.value); } catch(e) {}
  if (st) {
    st.classList.add('visible');
    setTimeout(function() { st.classList.remove('visible'); }, 1800);
  }
}

// ---- Copy prompt to clipboard ----
function copyPrompt(id) {
  var ta = document.getElementById('textarea-' + id);
  if (!ta || !ta.value.trim()) return;
  var text = ta.value;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showToast).catch(function() {
      fallbackCopy(ta);
    });
  } else {
    fallbackCopy(ta);
  }
}

function fallbackCopy(ta) {
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  showToast();
}

function showToast() {
  var t = document.getElementById('copy-toast');
  if (!t) return;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2100);
}

// Expose for inline onclick
window.savePrompt = savePrompt;
window.copyPrompt = copyPrompt;
</script>
</body>
</html>
