<!DOCTYPE html>
<html lang="en">
<head>
  <!--
  ============================================================
  CONTENT CALENDAR — EDIT GUIDE
  ============================================================
  GitHub Pages embed URL: https://javauntgarcia.github.io/Notion/Content%20Calendar.html
  Notion embed: paste above URL into a /embed block

  SEARCH LANDMARKS:
  - Palette / colors:     search "EDIT: palette"
  - Background image:     search "EDIT: background"
  - Topbar back link:     search "EDIT: back link"
  - Week calendar logic:  search "EDIT: calendar"
  - Ideas section:        search "EDIT: ideas"
  - localStorage keys:    search "EDIT: localStorage"
  ============================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ======================================================
       EDIT: palette — derived from Content_Calendar.jpg
       Dominant: deep cobalt blue / indigo
       Accent: electric periwinkle (#5b6fff)
       Highlight: warm amber/gold sunset (#e8a030)
       ====================================================== */
    :root {
      --primary:       #080d2a;
      --primary-mid:   #0f1640;
      --accent:        #5b6fff;
      --highlight:     #e8a030;
      --warm-white:    #e8eaff;
      --warm-white-light: #e8eaff;
      --ivory:         #f0f2ff;
      --glass:         rgba(91, 111, 255, 0.09);
      --glass-hover:   rgba(91, 111, 255, 0.17);
      --glass-b:       rgba(124, 143, 255, 0.22);

      --film:          rgba(180, 80, 220, 0.72);
      --edit:          rgba(232, 160, 48, 0.80);
      --post:          rgba(48, 200, 140, 0.72);
      --film-b:        rgba(180, 80, 220, 0.28);
      --edit-b:        rgba(232, 160, 48, 0.28);
      --post-b:        rgba(48, 200, 140, 0.28);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Mono', monospace;
      color: var(--warm-white);
      background: var(--primary);
      overflow-x: hidden;
    }

    /* ======================================================
       PAGE WRAP
       ====================================================== */
    .page-wrap { position: relative; min-height: 100vh; }

    .content { position: relative; z-index: 1; }

    /* ======================================================
       CALENDAR SURFACE + BACKGROUND
       EDIT: background — change image filename in src below
       The image now lives behind the calendar card only.
       ====================================================== */
    .calendar-surface {
      --warm-white: var(--warm-white-light);
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid var(--glass-b);
      padding: 2.5rem 1.25rem 3rem;
      min-height: 760px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--primary-mid);
    }

    @media (max-width: 700px) {
      .calendar-surface { min-height: 520px; padding: 1.5rem 1rem 2rem; }
    }

    .bg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .bg-layer img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    /* EDIT: overlay — lightened so the full image (including the heart/teeth detail) reads clearly */
    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(5, 8, 32, 0.06) 0%,
        rgba(8, 13, 42, 0.14) 55%,
        rgba(6, 8, 26, 0.42) 100%
      );
    }

    .calendar-inner { position: relative; z-index: 1; }

    /* ======================================================
       TOPBAR
       ====================================================== */
    .topbar {
      --warm-white: var(--warm-white-light);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 48px;
      background: rgba(5, 8, 32, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(124, 143, 255, 0.10);
    }

    /* EDIT: back link — change href */
    .topbar-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .topbar-back:hover { opacity: 1; }

    .topbar-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--warm-white);
      opacity: 0.38;
      letter-spacing: 0.08em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .save-status {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.25s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .save-status.show { opacity: 0.75; }
    .save-status.saving { color: var(--warm-white); }
    .save-status.saved { color: #6fe0a8; }
    .save-status.error { color: #ff8a8a; }
    .save-status .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ======================================================
       MASTHEAD — shorter so calendar pulls up into view
       ====================================================== */
    .masthead {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* push content UP so calendar appears in the lower half of the hero */
      justify-content: flex-start;
      padding-top: 15vh;
      padding-bottom: 0;
      text-align: center;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      opacity: 0.9;
    }

    .masthead h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 700;
      line-height: 1.05;
      color: var(--warm-white);
      letter-spacing: -0.01em;
    }

    .masthead h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--highlight);
    }

    /* Calendar floats up into the masthead area */
    .masthead-calendar {
      margin-top: 3rem;
      width: 100%;
      max-width: 1180px;
      padding: 0 1.5rem;
    }

    .scroll-cue { display: none; } /* hidden — calendar IS the scroll content */

    /* ======================================================
       SECTION / LAYOUT
       ====================================================== */
    .section {
      max-width: 980px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.75;
      margin-bottom: 1.5rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(91,111,255,0.18), transparent);
      max-width: 980px;
      margin: 0 auto;
    }

    /* ======================================================
       BUTTONS
       ====================================================== */
    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 99px;
      padding: 0.45rem 1.1rem;
      background: rgba(91,111,255,0.10);
      border: 1px solid rgba(91,111,255,0.30);
      color: var(--accent);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(91,111,255,0.20); }
    .btn-sm { font-size: 0.55rem; padding: 0.3rem 0.75rem; }
    .btn-danger {
      color: rgba(255,100,80,0.8);
      background: rgba(255,80,60,0.07);
      border-color: rgba(255,80,60,0.22);
    }
    .btn-danger:hover { background: rgba(255,80,60,0.15); }
    .btn-gold {
      color: var(--highlight);
      background: rgba(232,160,48,0.09);
      border-color: rgba(232,160,48,0.28);
    }
    .btn-gold:hover { background: rgba(232,160,48,0.17); }

    /* ======================================================
       TAB SWITCHER
       ====================================================== */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .tab-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 0.5rem 1.4rem;
      border-radius: 99px;
      cursor: pointer;
      border: 1px solid rgba(91,111,255,0.18);
      background: transparent;
      color: var(--warm-white);
      opacity: 0.4;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(91,111,255,0.14);
      border-color: rgba(91,111,255,0.48);
      color: #a0aeff;
      opacity: 1;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ======================================================
       EDIT: calendar — weekly grid
       ====================================================== */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.1rem;
    }

    .week-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 400;
      font-style: italic;
      color: var(--warm-white);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.5rem;
    }

    @media (max-width: 700px) {
      .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Single column on phone widths so no day gets clipped */
    @media (max-width: 480px) {
      .week-grid { grid-template-columns: minmax(0, 1fr); }
      .day-col { min-height: 0; }
    }

    .day-col {
      background: rgba(8,13,42,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-b);
      border-radius: 12px;
      padding: 0.8rem 0.6rem;
      min-height: 180px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .day-col.today-col {
      border-color: rgba(91,111,255,0.55);
      background: rgba(91,111,255,0.13);
      box-shadow: 0 0 20px rgba(91,111,255,0.10);
    }

    .day-name {
      font-family: 'DM Mono', monospace;
      font-size: 0.54rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.72;
    }

    .day-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: var(--warm-white);
      margin-bottom: 0.1rem;
    }

    .day-videos {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
    }

    .video-pill {
      background: rgba(91,111,255,0.07);
      border: 1px solid rgba(91,111,255,0.18);
      border-radius: 8px;
      padding: 0.38rem 0.48rem;
      touch-action: none; /* let our JS own the gesture instead of the page scrolling under a finger-drag */
    }

    .video-pill-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem;
      margin-bottom: 0.18rem;
    }

    .video-pill-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.56rem;
      color: var(--warm-white);
      opacity: 0.82;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .pill-del {
      background: none; border: none; cursor: pointer; padding: 0;
      color: rgba(255,100,80,0.35); flex-shrink: 0; transition: color 0.15s;
    }
    .pill-del:hover { color: rgba(255,100,80,0.9); }

    .status-row { display: flex; gap: 0.2rem; flex-wrap: wrap; }

    .status-chip {
      font-family: 'DM Mono', monospace;
      font-size: 0.46rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 99px;
      padding: 0.09rem 0.38rem;
      cursor: pointer;
      border: 1px solid transparent;
      opacity: 0.4;
      transition: opacity 0.15s, background 0.15s;
      user-select: none;
    }
    .status-chip.active { opacity: 1; }
    .status-chip.film { background: var(--film); border-color: var(--film-b); color: #f0d0ff; }
    .status-chip.edit { background: var(--edit); border-color: var(--edit-b); color: #fff0cc; }
    .status-chip.post { background: var(--post); border-color: var(--post-b); color: #c0f5e0; }
    .status-chip:not(.active).film { background: rgba(180,80,220,0.05); color: rgba(240,208,255,0.35); }
    .status-chip:not(.active).edit { background: rgba(232,160,48,0.05);  color: rgba(255,240,204,0.35); }
    .status-chip:not(.active).post { background: rgba(48,200,140,0.05);  color: rgba(192,245,224,0.35); }

    .add-video-btn {
      margin-top: auto;
      font-family: 'DM Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.35;
      background: none; border: none; cursor: pointer;
      padding: 0; text-align: left; transition: opacity 0.15s;
    }
    .add-video-btn:hover { opacity: 0.82; }

    /* ======================================================
       MODALS
       ====================================================== */
    .modal-overlay {
      --warm-white: var(--warm-white-light);
      --highlight: #e8a030;
      display: none;
      position: fixed;
      inset: 0; z-index: 200;
      background: rgba(4,6,24,0.78);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: rgba(10,14,50,0.97);
      border: 1px solid rgba(91,111,255,0.24);
      border-radius: 18px;
      padding: 2rem;
      width: min(500px, 93vw);
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-style: italic;
      font-weight: 400;
      color: var(--warm-white);
    }

    .modal-field label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 0.57rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 0.4rem;
    }

    .modal-field input[type="text"],
    .modal-field input[type="url"],
    .modal-field textarea,
    .modal-field select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(91,111,255,0.18);
      border-radius: 8px;
      color: var(--warm-white);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      padding: 0.58rem 0.8rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal-field input[type="text"]:focus,
    .modal-field input[type="url"]:focus,
    .modal-field textarea:focus,
    .modal-field select:focus { border-color: rgba(91,111,255,0.55); }
    .modal-field textarea { resize: vertical; min-height: 68px; }
    .modal-field select option { background: #0a0e32; }

    .modal-field.url-field input {
      border-color: rgba(232,160,48,0.20);
    }
    .modal-field.url-field input:focus {
      border-color: rgba(232,160,48,0.55);
    }

    .modal-actions {
      display: flex; gap: 0.6rem;
      justify-content: flex-end;
      padding-top: 0.3rem;
    }

    /* ---- Video modal: idea picker ---- */
    .idea-picker-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    .idea-picker-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid rgba(91,111,255,0.14);
      background: rgba(91,111,255,0.05);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .idea-picker-item:hover { background: rgba(91,111,255,0.12); }
    .idea-picker-item.selected {
      background: rgba(91,111,255,0.18);
      border-color: rgba(91,111,255,0.50);
    }

    .idea-picker-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid rgba(91,111,255,0.4);
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    .idea-picker-item.selected .idea-picker-dot {
      background: var(--accent);
      border-color: var(--accent);
    }

    .idea-picker-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--warm-white);
      flex: 1;
    }

    .idea-picker-platforms {
      display: flex; gap: 0.22rem; flex-wrap: wrap;
    }

    .idea-picker-platforms span {
      font-family: 'DM Mono', monospace;
      font-size: 0.44rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 99px;
      padding: 0.1rem 0.4rem;
      border: 1px solid rgba(91,111,255,0.22);
      color: #a0aeff;
      background: rgba(91,111,255,0.07);
    }

    .idea-picker-empty {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--warm-white);
      opacity: 0.28;
      text-align: center;
      padding: 1.2rem 0;
    }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.2rem 0;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(91,111,255,0.14);
    }
    .or-divider span {
      font-family: 'DM Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--warm-white);
      opacity: 0.28;
    }

    /* status checks in video modal */
    .status-checks { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .status-check { display: flex; align-items: center; gap: 0.38rem; cursor: pointer; }
    .status-check input[type="checkbox"] { cursor: pointer; }
    .status-check span {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      opacity: 0.78;
    }

    /* ======================================================
       EDIT: ideas — draggable Idea Bank board (7 color-themed panels)
       ====================================================== */
    /* Banks now live in a responsive CSS grid instead of freeform absolute
       positioning. This guarantees panels can never overlap — the grid
       reflows every panel's position based on the actual rendered height of
       its neighbors, so adding items to one category just grows that cell
       and pushes nothing else out of place. It also collapses to a single
       column automatically on narrow (iPhone-width) screens. */
    .ideas-board {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 700px) {
      .ideas-board { padding: 0 1rem; gap: 1rem; grid-template-columns: 1fr; }
    }

    .idea-bank {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(5,8,32,0.18);
      overflow: hidden;
      user-select: none;
    }

    .bank-drag-handle {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem;
      padding: 0.85rem 1.1rem 0.6rem;
    }

    .bank-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--warm-white);
      line-height: 1.15;
    }

    /* Capped + scrollable so a category with lots of ideas doesn't grow
       tall enough to swallow the whole screen — keeps every panel
       reachable at once, which is what makes cross-category dragging
       actually usable instead of requiring endless scrolling. */
    .idea-bank .ideas-list {
      padding: 0 1.1rem;
      display: flex; flex-direction: column; gap: 0.55rem;
      max-height: 420px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .idea-bank .ideas-add-bar { padding: 0.9rem 1.1rem 1.1rem; margin-top: 0; display: flex; justify-content: flex-end; }
    .idea-bank .empty-state { padding: 1.2rem 0 1.6rem; font-size: 0.56rem; }

    @media (max-width: 700px) {
      .idea-bank .ideas-list { max-height: 42vh; }
    }

    .ideas-list { display: flex; flex-direction: column; gap: 0.7rem; }

    .idea-card {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 12px;
      overflow: hidden;
      cursor: grab;
      touch-action: none; /* let our JS own the gesture instead of the page scrolling under a finger-drag */
    }
    .idea-card.dragging { opacity: 0.35; }

    /* Floating clone shown under the pointer/finger while dragging an idea
       card or video pill. Fixed-position + translate() keeps this cheap to
       animate on mobile Safari. */
    .drag-ghost {
      position: fixed;
      top: 0; left: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.92;
      box-shadow: 0 16px 34px rgba(5,8,32,0.4);
      transform-origin: top left;
    }

    .idea-bank .ideas-list.drag-over {
      background: rgba(255,255,255,0.30);
      border-radius: 10px;
      outline: 1.5px dashed rgba(0,0,0,0.18);

<script>
// ── SUPABASE CONFIG ──
const SB_URL = 'https://ghcpmekdumlqrmjruuyn.supabase.co';
const SB_KEY = 'sb_publishable_Am9YxRGdHcF9eIDD032STA_FuyKXaYj';
async function sbGet(table, id) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
    const d = await r.json(); return d && d[0] ? d[0] : null;
  } catch(e) { return null; }
}
async function sbUpsert(table, row) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}?on_conflict=id`, {
    method: 'POST',
    keepalive: true, // let the write finish even if the tab is closing (e.g. right after a drag)
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify({ ...row, updated_at: new Date().toISOString() })
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`sbUpsert ${table} failed: ${res.status} ${text}`);
  }
}
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

  /* ---- Topbar date ---- */
  (function() {
    const d = new Date();
    const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('topbar-date').textContent =
      days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  })();

  /* ---- Supabase-backed state ---- */
  let _ccData = { id: 'singleton', calendar: {}, ideas: [], ideaBoard: {} };

  function setSaveStatus(state) {
    const el = document.getElementById('save-status');
    if (!el) return;
    el.className = 'save-status show ' + state;
    const label = state === 'saving' ? 'Saving…' : state === 'saved' ? 'Saved' : 'Save failed — retrying';
    el.innerHTML = `<span class="dot"></span>${label}`;
    if (state === 'saved') {
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }
  }

  // Every mutation (adding, editing, deleting, or MOVING an idea between
  // categories) funnels through here. localStorage is written first and
  // synchronously, so a move is never lost even if the network call below
  // fails or the tab closes mid-request. The Supabase write is retried once
  // automatically since a dropped/failed request was the main reason moves
  // could silently fail to persist across devices/reloads.
  let _saveInFlight = null;
  let _savePending = false;

  async function saveCal() {
    try { localStorage.setItem('cc_calendar', JSON.stringify(_ccData.calendar)); } catch(e) {}
    try { localStorage.setItem('cc_ideaboard', JSON.stringify(_ccData.ideaBoard)); } catch(e) {}

    // Coalesce rapid-fire saves (e.g. a drag move touches two banks in a
    // row) into a single in-flight request instead of racing two POSTs.
    if (_saveInFlight) { _savePending = true; return; }

    _saveInFlight = (async () => {
      setSaveStatus('saving');
      const snapshot = JSON.parse(JSON.stringify(_ccData));
      try {
        await sbUpsert('content_calendar', snapshot);
        setSaveStatus('saved');
      } catch (e) {
        console.warn('Content Calendar: save failed, retrying once', e);
        try {
          await sbUpsert('content_calendar', snapshot);
          setSaveStatus('saved');
        } catch (e2) {
          console.error('Content Calendar: save failed after retry', e2);
          setSaveStatus('error');
        }
      } finally {
        _saveInFlight = null;
        if (_savePending) { _savePending = false; saveCal(); }
      }
    })();
    return _saveInFlight;
  }

  /* ============================================================
     UNIVERSAL DRAG & DROP
     Works with mouse AND touch (iPhone Safari does not fire the old
     HTML5 dragstart/dragover/drop events for touch input, which is why
     dragging into a category previously appeared to "not save" on phone —
     the drop event simply never happened). Pointer Events fire consistently
     on every platform, so this single implementation replaces the old
     dataTransfer-based drag code for both video pills and idea cards.
     ============================================================ */
  function enableDragReorder(el, { getPayload, zoneSelector, onDrop }) {
    let pointerId = null, startX = 0, startY = 0, dragging = false, ghost = null, activeZone = null;

    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('button, a, input, .status-chip')) return; // don't hijack taps on controls
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      dragging = false;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
    });

    function startDrag(e) {
      dragging = true;
      el.classList.add('dragging');
      const rect = el.getBoundingClientRect();
      ghost = el.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = rect.width + 'px';
      ghost.style.left = rect.left + 'px';
      ghost.style.top = rect.top + 'px';
      document.body.appendChild(ghost);
      try { el.setPointerCapture(pointerId); } catch (_) {}
    }

    function onMove(e) {
      if (e.pointerId !== pointerId) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        startDrag(e);
      }
      e.preventDefault();
      if (ghost) ghost.style.transform = `translate(${dx}px, ${dy}px)`;
      if (activeZone) activeZone.classList.remove('drag-over');
      ghost.style.display = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      ghost.style.display = '';
      activeZone = under && under.closest(zoneSelector);
      if (activeZone) activeZone.classList.add('drag-over');
    }

    function onUp(e) {
      if (e.pointerId !== pointerId) return;
      cleanupListeners();
      if (dragging) {
        if (activeZone) onDrop(activeZone, getPayload());
        finishDrag();
      }
    }
    function onCancel(e) {
      if (e.pointerId !== pointerId) return;
      cleanupListeners();
      if (dragging) finishDrag();
    }
    function finishDrag() {
      el.classList.remove('dragging');
      if (activeZone) { activeZone.classList.remove('drag-over'); activeZone = null; }
      if (ghost) { ghost.remove(); ghost = null; }
      dragging = false;
    }
    function cleanupListeners() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
    }
  }

  /* ============================================================
     CALENDAR
     ============================================================ */
  let weekOffset = 0;

  function getCalData() { return _ccData.calendar || {}; }
  function setCalData(d) { _ccData.calendar = d; saveCal(); }

  function getWeekDates(offset) {
    const today = new Date(); today.setHours(0,0,0,0);
    const dow = today.getDay();
    const monday = new Date(today);
    monday.setDate(today.getDate() - (dow===0 ? 6 : dow-1) + (offset*7));
    return Array.from({length:7}, (_,i) => {
      const d = new Date(monday); d.setDate(monday.getDate()+i); return d;
    });
  }

  function dateKey(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function shiftWeek(dir) { weekOffset += dir; renderCalendar(); }

  const DAY_NAMES   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function renderCalendar() {
    const dates = getWeekDates(weekOffset);
    const cal   = getCalData();
    const today = new Date(); today.setHours(0,0,0,0);

    const s = dates[0], e = dates[6];
    document.getElementById('week-label').textContent =
      MONTH_SHORT[s.getMonth()] + ' ' + s.getDate() + ' – ' +
      (s.getMonth()!==e.getMonth() ? MONTH_SHORT[e.getMonth()]+' ':'') +
      e.getDate() + ', ' + e.getFullYear();

    const grid = document.getElementById('week-grid');
    grid.innerHTML = '';

    dates.forEach((date, i) => {
      const key    = dateKey(date);
      const videos = cal[key] || [];
      const isToday = date.getTime() === today.getTime();

      const col = document.createElement('div');
      col.className = 'day-col' + (isToday ? ' today-col' : '');
      col.dataset.key = key;
      col.innerHTML = `
        <div class="day-name">${DAY_NAMES[i]}</div>
        <div class="day-num">${date.getDate()}</div>
        <div class="day-videos" id="vids-${key}"></div>
        <button class="add-video-btn" onclick="openVideoModal('${key}')">+ schedule</button>
      `;
      grid.appendChild(col);

      const vidsEl = col.querySelector('#vids-'+key);
      videos.forEach((v, vi) => renderVideoPill(vidsEl, key, vi, v));
    });
  }

  function renderVideoPill(container, dk, idx, v) {
    const pill = document.createElement('div');
    pill.className = 'video-pill' + (v.archived ? ' archived' : '');
    pill.dataset.dk = dk;
    pill.dataset.idx = idx;

    const statusHTML = ['film','edit','post'].map(s => {
      const active = v.status && v.status.includes(s);
      return `<span class="status-chip ${s}${active?' active':''}"
                    onclick="toggleStatus(event,'${dk}',${idx},'${s}')">${s}</span>`;
    }).join('');

    // Check (archive) icon — checkmark circle
    const checkTitle = v.archived ? 'Unmark as posted' : 'Mark as posted';
    const checkColor = v.archived ? 'rgba(48,200,140,0.85)' : 'rgba(48,200,140,0.28)';
    pill.innerHTML = `
      <div class="video-pill-top">
        <button class="pill-check" onclick="toggleArchive(event,'${dk}',${idx})" title="${checkTitle}" style="color:${checkColor};">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </button>
        <span class="video-pill-title" title="${v.title}">${v.title}</span>
        <button class="pill-move" onclick="openMoveModal(event,'${dk}',${idx})" title="Move to another day" style="background:none;border:none;cursor:pointer;padding:0;color:rgba(91,111,255,0.35);flex-shrink:0;transition:color 0.15s;" onmouseover="this.style.color='rgba(91,111,255,0.9)'" onmouseout="this.style.color='rgba(91,111,255,0.35)'">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        </button>
        <button class="pill-del" onclick="deleteVideo(event,'${dk}',${idx})" title="Remove">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="status-row">${statusHTML}</div>`;

    // ── Drag-and-drop (mouse + touch, incl. iPhone) ──
    enableDragReorder(pill, {
      getPayload: () => ({ dk, idx }),
      zoneSelector: '.day-col',
      onDrop: (zone, payload) => {
        const toDk = zone.dataset.key;
        if (toDk && toDk !== payload.dk) moveVideo(payload.dk, payload.idx, toDk);
      }
    });

    container.appendChild(pill);
  }

  // Archive toggle
  function toggleArchive(e, dk, idx) {
    e.stopPropagation();
    const cal = getCalData();
    cal[dk][idx].archived = !cal[dk][idx].archived;
    setCalData(cal);
    renderCalendar();
  }

  // Move a video from one date key to another
  function moveVideo(fromDk, fromIdx, toDk) {
    const cal = getCalData();
    if (!cal[fromDk]) return;
    const [video] = cal[fromDk].splice(fromIdx, 1);
    if (!cal[fromDk].length) delete cal[fromDk];
    if (!cal[toDk]) cal[toDk] = [];
    cal[toDk].push(video);
    setCalData(cal);
    renderCalendar();
  }

  /* ---- Move Modal ---- */
  let _moveSrc = null; // { dk, idx }
  let _moveWeekOffset = 0;

  function openMoveModal(e, dk, idx) {
    e.stopPropagation();
    _moveSrc = { dk, idx };
    _moveWeekOffset = weekOffset; // start on current week
    renderMoveModal();
    document.getElementById('move-modal').classList.add('open');
  }

  function closeMoveModal() {
    document.getElementById('move-modal').classList.remove('open');
    _moveSrc = null;
  }

  function shiftMoveWeek(dir) { _moveWeekOffset += dir; renderMoveModal(); }

  function renderMoveModal() {
    const dates = getWeekDates(_moveWeekOffset);
    const s = dates[0], en = dates[6];
    document.getElementById('move-week-label').textContent =
      MONTH_SHORT[s.getMonth()] + ' ' + s.getDate() + ' – ' +
      (s.getMonth()!==en.getMonth() ? MONTH_SHORT[en.getMonth()]+' ':'') +
      en.getDate() + ', ' + en.getFullYear();

    const grid = document.getElementById('move-day-grid');
    grid.innerHTML = '';
    dates.forEach((date, i) => {

          closeMoveModal();

  document.getElementById('move-modal').addEventListener('click', function(e) {
    if (e.target === this) closeMoveModal();
  });

  /* ---- Video modal ---- */
  let _videoTargetDate = null;
  let _selectedIdeaTitle = null; // tracks which idea picker row is selected

  function openVideoModal(key) {
    _videoTargetDate   = key;
    _selectedIdeaTitle = null;
    document.getElementById('vm-title').value = '';
    ['vm-film','vm-edit','vm-post'].forEach(id => document.getElementById(id).checked = false);

    // Populate idea picker from all idea banks
    const ideas = allIdeasFlat();
    const pickerList = document.getElementById('idea-picker-list');
    pickerList.innerHTML = '';

    if (!ideas.length) {
      pickerList.innerHTML = '<div class="idea-picker-empty">No ideas yet — add some in the Idea Banks below.</div>';
    } else {
      ideas.forEach((idea, idx) => {
        const item = document.createElement('div');
        item.className = 'idea-picker-item';
        item.dataset.title = idea.title;
        const platforms = (idea.platforms || []).map(p =>
          `<span>${p}</span>`).join('');
        item.innerHTML = `
          <div class="idea-picker-dot"></div>
          <span class="idea-picker-name">${idea.title}</span>
          <div class="idea-picker-platforms">${platforms}</div>`;
        item.addEventListener('click', () => {
          // deselect all, select this one
          pickerList.querySelectorAll('.idea-picker-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          _selectedIdeaTitle = idea.title;
          // clear custom title field when an idea is selected
          document.getElementById('vm-title').value = '';
        });
        pickerList.appendChild(item);
      });
    }

    document.getElementById('video-modal').classList.add('open');
  }

  function closeVideoModal() {
    document.getElementById('video-modal').classList.remove('open');
    _videoTargetDate   = null;
    _selectedIdeaTitle = null;
  }

  function saveVideo() {
    // Priority: selected idea > custom title input
    const customTitle = document.getElementById('vm-title').value.trim();
    const title = _selectedIdeaTitle || customTitle;
    if (!title) {
      // highlight both fields
      document.getElementById('vm-title').focus();
      return;
    }
    const status = [];
    if (document.getElementById('vm-film').checked) status.push('film');
    if (document.getElementById('vm-edit').checked) status.push('edit');
    if (document.getElementById('vm-post').checked) status.push('post');

    const cal = getCalData();
    if (!cal[_videoTargetDate]) cal[_videoTargetDate] = [];
    cal[_videoTargetDate].push({ title, status });
    setCalData(cal);
    closeVideoModal();
    renderCalendar();
  }

  function toggleStatus(e, dk, idx, s) {
    e.stopPropagation();
    const cal = getCalData();
    const v = cal[dk][idx];
    if (!v.status) v.status = [];
    const i = v.status.indexOf(s);
    if (i >= 0) v.status.splice(i, 1); else v.status.push(s);
    setCalData(cal);
    renderCalendar();
  }

  function deleteVideo(e, dk, idx) {
    e.stopPropagation();
    const cal = getCalData();
    cal[dk].splice(idx, 1);
    if (!cal[dk].length) delete cal[dk];
    setCalData(cal);
    renderCalendar();
  }

  document.getElementById('video-modal').addEventListener('click', function(e) {
    if (e.target===this) closeVideoModal();
  });

  // Clear selected idea if user starts typing custom title

    if (this.value.trim()) {
      document.getElementById('idea-picker-list')
        .querySelectorAll('.idea-picker-item')
        .forEach(el => el.classList.remove('selected'));

  function getBoard() { return _ccData.ideaBoard || (_ccData.ideaBoard = {}); }

  function getBankState(id) {
    const board = getBoard();
    if (!board[id]) board[id] = { ideas: [] };
    if (!board[id].ideas) board[id].ideas = [];
    return board[id];
  }

  function getBankIdeas(id) { return getBankState(id).ideas; }
  function setBankIdeas(id, arr) { getBankState(id).ideas = arr; saveCal(); }

  function allIdeasFlat() {
    return BANK_CONFIG.flatMap(cfg => getBankIdeas(cfg.id));
  }

  function renderIdeaBanks() {
    const board = document.getElementById('ideas-board');
    board.innerHTML = '';

    BANK_CONFIG.forEach(cfg => {
      const panel = document.createElement('div');
      panel.className = 'idea-bank';
      panel.id = 'bank-' + cfg.id;
      panel.style.background = cfg.bg;
      panel.style.setProperty('--warm-white', cfg.ink);
      panel.style.setProperty('--accent', cfg.accent);
      panel.style.setProperty('--highlight', cfg.highlight);
      panel.style.setProperty('--glass', 'rgba(255,255,255,0.45)');
      panel.style.setProperty('--glass-hover', 'rgba(255,255,255,0.68)');
      panel.style.setProperty('--glass-b', cfg.glassB);

      panel.innerHTML = `
        <div class="bank-drag-handle">
          <span class="bank-title">${cfg.title}</span>
        </div>
        <div class="ideas-list" id="ideas-list-${cfg.id}" data-bank="${cfg.id}"></div>
        <div class="ideas-add-bar">
          <button class="btn btn-sm" onclick="openIdeaModal(undefined, '${cfg.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:3px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Idea
          </button>
        </div>`;

      board.appendChild(panel);
      renderBankIdeas(cfg.id);
    });
  }

  function moveIdea(fromBank, fromIdx, toBank) {
    const fromIdeas = getBankIdeas(fromBank);
    if (!fromIdeas[fromIdx]) return;
    const [idea] = fromIdeas.splice(fromIdx, 1);
    const toIdeas = getBankIdeas(toBank);
    toIdeas.push(idea);
    // Mutate both banks first, then save once — avoids firing two
    // near-simultaneous network requests for a single move.
    saveCal();
    renderBankIdeas(fromBank);
    renderBankIdeas(toBank);
  }

  /* ---- Idea Move Modal (tap-to-move fallback, doesn't require the
     source and target category to both be visible on screen) ---- */

    document.getElementById('idea-move-modal').classList.add('open');
  }

  function closeIdeaMoveModal() {
    document.getElementById('idea-move-modal').classList.remove('open');

  function renderIdeaMoveModal() {
    const grid = document.getElementById('idea-move-grid');
    grid.innerHTML = '';
    BANK_CONFIG.forEach(cfg => {
      const isOrigin = _ideaMoveSrc && cfg.id === _ideaMoveSrc.bankId;
      const btn = document.createElement('button');

      btn.textContent = cfg.title + (isOrigin ? ' (current)' : '');

        `<span class="platform-tag">${p}</span>`).join('');

      const shotsHTML = (idea.shots || []).map((sh, si) =>
        `<div class="shot-row">
          <span class="shot-num">Shot ${si+1}</span>
          <span class="shot-text">${sh}</span>
        </div>`).join('');

            Inspo

            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

              <button class="btn btn-sm" onclick="openIdeaMoveModal(event, '${bankId}', ${idx})">

  /* ---- Idea modal ---- */
  let _editIdeaIdx = null;
  let _editIdeaBank = null;
  let _shotCount   = 0;

  function openIdeaModal(existingIdx, bankId) {
    _editIdeaIdx  = existingIdx !== undefined ? existingIdx : null;
    _editIdeaBank = bankId;
    _shotCount    = 0;
    document.getElementById('idea-modal-title').textContent = _editIdeaIdx !== null ? 'Edit Idea' : 'New Idea';
    document.getElementById('im-title').value = '';
    document.getElementById('im-url').value   = '';
    ['tiktok','instagram','facebook','linkedin'].forEach(p =>
      document.getElementById('im-'+p).checked = false);
    document.getElementById('shots-builder').innerHTML = '';

    if (_editIdeaIdx !== null) {
      const idea = getBankIdeas(_editIdeaBank)[_editIdeaIdx];
      document.getElementById('im-title').value = idea.title || '';
      document.getElementById('im-url').value   = idea.url   || '';
      (idea.platforms || []).forEach(p => {
        const el = document.getElementById('im-'+p.toLowerCase());
        if (el) el.checked = true;
      });
      (idea.shots || []).forEach(sh => addShotInput(sh));

  function editIdea(bankId, idx) { openIdeaModal(idx, bankId); }

  document.getElementById('idea-modal').addEventListener('click', function(e) {

  function addShotInput(val) {
    _shotCount++;

    row.className = 'shot-input-row';
    row.innerHTML = `
      <span class="shot-label">Shot ${n}</span>

  function saveIdea() {
    const title = document.getElementById('im-title').value.trim();
    if (!title) { document.getElementById('im-title').focus(); return; }
    const url = document.getElementById('im-url').value.trim();
    const platforms = [];
    if (document.getElementById('im-tiktok').checked)    platforms.push('TikTok');
    if (document.getElementById('im-instagram').checked) platforms.push('Instagram');
    if (document.getElementById('im-facebook').checked)  platforms.push('Facebook');
    if (document.getElementById('im-linkedin').checked)  platforms.push('LinkedIn');
    const shots = Array.from(document.querySelectorAll('.shot-input'))
      .map(i => i.value.trim()).filter(Boolean);

    const idea  = { title, url, platforms, shots };
    const bankId = _editIdeaBank || 'misc';
    const ideas  = getBankIdeas(bankId);
    if (_editIdeaIdx !== null) ideas[_editIdeaIdx] = idea;
    else ideas.push(idea);

    setBankIdeas(bankId, ideas);
    closeIdeaModal();
    renderBankIdeas(bankId);
  }

  /* ---- Init ---- */
  (async function() {
    const row = await sbGet('content_calendar', 'singleton');
    if (row) {
      _ccData = { ..._ccData, ...row };
      if (!_ccData.ideaBoard) _ccData.ideaBoard = {};
    } else {
      try { _ccData.calendar  = JSON.parse(localStorage.getItem('cc_calendar')  || '{}'); } catch(e) {}
      try { _ccData.ideaBoard = JSON.parse(localStorage.getItem('cc_ideaboard') || '{}'); } catch(e) {}
    }
    // Migrate any legacy flat "ideas" array into the Miscellaneous bank
    if (_ccData.ideas && _ccData.ideas.length) {
      const misc = getBankState('misc');
      misc.ideas = misc.ideas.concat(_ccData.ideas);
      _ccData.ideas = [];
    }
    renderCalendar();
    renderIdeaBanks();
  })();
</script>
</body>
</html>
