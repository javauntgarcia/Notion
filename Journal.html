<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — Growth</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root {
  --slate: #1a1c1e;
  --slate-mid: #222427;
  --silver: rgba(210,215,220,0.88);
  --silver-dim: rgba(190,198,208,0.55);
  --silver-ghost: rgba(170,180,195,0.28);
  --silver-veil: rgba(160,170,185,0.1);
  --water: rgba(140,160,185,0.4);
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'DM Mono', monospace;
}

html, body {
  min-height: 100vh;
  background: #111315;
  font-family: var(--font-body);
  color: var(--silver);
  overflow-x: hidden;
}

/* ── BACKGROUND ── */
.bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  min-height: 100%;
}
.bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 40%;
  filter: brightness(0.58) contrast(1.08) grayscale(0.15);
}
.bg-vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(8,10,12,0.92) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(8,10,12,0.75) 0%, transparent 55%),
    radial-gradient(ellipse 40% 100% at 0% 50%, rgba(8,10,12,0.5) 0%, transparent 60%),
    radial-gradient(ellipse 40% 100% at 100% 50%, rgba(8,10,12,0.5) 0%, transparent 60%);
}

/* ── LAYOUT ── */
.page-wrap {
  position: relative;
  min-height: 100vh;
}
.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding-bottom: 6rem;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2rem 1.5rem 1.25rem;
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
}
.header-left { display: flex; align-items: center; gap: 1rem; }
.back-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 0.5px solid var(--silver-ghost);
  background: rgba(20,22,26,0.4);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  flex-shrink: 0; backdrop-filter: blur(8px);
  color: var(--silver-dim); font-size: 14px; text-decoration: none;
}
.back-btn:hover { background: rgba(140,160,185,0.1); border-color: var(--silver-dim); }
.page-title-wrap .eyebrow {
  font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--silver-ghost); margin-bottom: 2px;
}
.page-title-wrap h1 {
  font-family: var(--font-display);
  font-size: 1.9rem; font-weight: 300; color: var(--silver);
  letter-spacing: 0.02em; line-height: 1.1;
}
.page-title-wrap h1 em { font-style: italic; color: rgba(180,195,215,0.9); }
.write-btn {
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 9px 20px;
  background: rgba(140,160,185,0.08);
  border: 0.5px solid rgba(140,160,185,0.25);
  border-radius: 100px; color: var(--silver-dim);
  cursor: pointer; transition: all 0.25s; backdrop-filter: blur(8px);
}
.write-btn:hover { background: rgba(140,160,185,0.15); color: var(--silver); border-color: rgba(140,160,185,0.45); }

/* ── MONTH TABS ── */
.month-nav {
  max-width: 760px; margin: 0 auto; width: 100%;
  padding: 0 1.5rem 1.25rem;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
}
.month-nav::-webkit-scrollbar { display: none; }
.month-tab {
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 100px;
  border: 0.5px solid var(--silver-ghost);
  background: rgba(15,17,20,0.4);
  color: var(--silver-ghost); cursor: pointer; transition: all 0.2s;
  white-space: nowrap; backdrop-filter: blur(6px); user-select: none;
}
.month-tab:hover { color: var(--silver-dim); border-color: rgba(140,160,185,0.3); }
.month-tab.active {
  background: rgba(140,160,185,0.1);
  border-color: rgba(140,160,185,0.35);
  color: var(--silver);
}

/* ── MAIN CONTENT ── */
.content-area {
  max-width: 760px; margin: 0 auto; width: 100%;
  padding: 0 1.5rem;
  flex: 1;
}

/* ── 52-WEEK SNAPSHOT ── */
.snapshot-strip {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem;
  background: rgba(15,18,22,0.45);
  border: 0.5px solid rgba(140,160,185,0.12);
  border-radius: 12px; padding: 0.85rem 1.25rem;
  backdrop-filter: blur(12px); margin-bottom: 1.25rem;
}
.snapshot-label {
  font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--silver-ghost); white-space: nowrap;
}
.snapshot-bar-wrap {
  flex: 1;
  height: 4px;
  background: rgba(140,160,185,0.12);
  border-radius: 2px;
  overflow: hidden;
}
.snapshot-bar-fill {
  height: 100%;
  background: rgba(140,160,185,0.55);
  border-radius: 2px;
  transition: width 0.5s ease;
}
.snapshot-stat {
  font-family: var(--font-display);
  font-size: 0.88rem; font-style: italic; color: var(--water);
  white-space: nowrap;
}

/* ── COMPOSER ── */
.composer {
  background: rgba(15,18,22,0.55);
  border: 0.5px solid rgba(140,160,185,0.18);
  border-radius: 18px;
  padding: 1.4rem;
  margin-bottom: 1.25rem;
  backdrop-filter: blur(16px);
  display: none;
  animation: fadeDown 0.3s ease;
}
.composer.open { display: block; }
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.composer-meta {
  display: flex; gap: 10px; align-items: center; margin-bottom: 12px;
}
.composer-date {
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--water);
}
.tag-input {
  background: rgba(140,160,185,0.07);
  border: 0.5px solid rgba(140,160,185,0.18);
  border-radius: 100px;
  padding: 4px 12px;
  font-size: 10px; font-family: var(--font-body);
  color: var(--silver-dim); outline: none;
  letter-spacing: 0.06em;
}
.tag-input::placeholder { color: rgba(140,160,185,0.3); }
.composer-textarea {
  width: 100%;
  background: transparent; border: none; outline: none;
  font-family: var(--font-display);
  font-size: 1.15rem; font-weight: 300; font-style: italic;
  color: var(--silver);
  resize: none; line-height: 1.85; min-height: 120px;
}
.composer-textarea::placeholder { color: rgba(140,160,185,0.25); }
.composer-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-top: 10px;
  border-top: 0.5px solid rgba(140,160,185,0.1);
}
.char-count { font-size: 9px; color: var(--silver-ghost); letter-spacing: 0.05em; }
.save-btn {
  font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 7px 18px; border-radius: 100px;
  background: rgba(140,160,185,0.12);
  border: 0.5px solid rgba(140,160,185,0.35);
  color: var(--silver-dim); cursor: pointer; transition: all 0.2s;
}
.save-btn:hover { background: rgba(140,160,185,0.22); color: var(--silver); }

/* ── MONTH SECTION ── */
.month-section { margin-bottom: 2rem; }
.month-section.hidden { display: none; }
.month-heading {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 1rem;
}
.month-heading-label {
  font-family: var(--font-display);
  font-size: 1.5rem; font-weight: 300; font-style: italic;
  color: rgba(180,195,215,0.7);
  letter-spacing: 0.02em;
}
.month-heading-line {
  flex: 1; height: 0.5px;
  background: linear-gradient(to right, rgba(140,160,185,0.2), transparent);
}
.month-count {
  font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--silver-ghost);
}

/* ── ENTRY CARD ── */
.entry-card {
  background: rgba(15,18,22,0.5);
  border: 0.5px solid rgba(140,160,185,0.14);
  border-radius: 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(12px);
  overflow: hidden;
  transition: border-color 0.25s;
}
.entry-card:hover { border-color: rgba(140,160,185,0.28); }
.entry-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.25rem;
  cursor: pointer; user-select: none;
  border-bottom: 0.5px solid transparent;
  transition: all 0.2s;
}
.entry-card.open .entry-header { border-bottom-color: rgba(140,160,185,0.1); }
.entry-header-left { display: flex; align-items: baseline; gap: 12px; }
.entry-date-label {
  font-family: var(--font-display);
  font-size: 1.15rem; font-weight: 300;
  color: var(--silver); letter-spacing: 0.02em;
}
.entry-tag {
  font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 100px;
  border: 0.5px solid rgba(140,160,185,0.2);
  color: var(--silver-ghost);
}
.entry-preview {
  font-family: var(--font-display);
  font-size: 0.92rem; font-style: italic; font-weight: 300;
  color: var(--silver-ghost);
  max-width: 260px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.entry-chevron {
  color: var(--silver-ghost); font-size: 10px;
  transition: transform 0.3s; flex-shrink: 0;
}
.entry-card.open .entry-chevron { transform: rotate(180deg); }
.entry-body {
  display: none; padding: 1.25rem;
  animation: entryOpen 0.3s ease;
}
.entry-card.open .entry-body { display: block; }
@keyframes entryOpen {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.editable-text {
  width: 100%; background: transparent; border: none; outline: none;
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 300; font-style: italic;
  color: var(--silver); resize: none; line-height: 1.85;
  min-height: 80px;
}
.entry-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 10px; border-top: 0.5px solid rgba(140,160,185,0.1);
}
.entry-wordcount { font-size: 9px; color: var(--silver-ghost); letter-spacing: 0.05em; }
.entry-actions { display: flex; gap: 8px; }
.entry-action-btn {
  font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 5px 12px; border-radius: 100px;
  border: 0.5px solid rgba(140,160,185,0.18);
  background: transparent; color: var(--silver-ghost);
  cursor: pointer; transition: all 0.2s;
}
.entry-action-btn:hover { color: var(--silver-dim); border-color: rgba(140,160,185,0.35); }
.entry-action-btn.danger:hover { color: rgba(200,120,120,0.7); border-color: rgba(200,120,120,0.25); }

/* ── EMPTY STATE ── */
.empty-month {
  text-align: center; padding: 2.5rem 0;
}
.empty-month p {
  font-family: var(--font-display);
  font-size: 1.05rem; font-style: italic;
  color: rgba(140,160,185,0.2); line-height: 1.7;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: center;
  padding: 0.75rem 1rem 1rem;
  background: linear-gradient(to top, rgba(8,10,12,0.93) 0%, transparent 100%);
}
.bottom-nav-inner {
  display: flex; gap: 4px;
  background: rgba(12,14,16,0.78);
  border: 0.5px solid rgba(140,160,185,0.14);
  border-radius: 100px; padding: 5px;
  backdrop-filter: blur(16px);
}
.nav-pill {
  font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 100px;
  cursor: pointer; transition: all 0.25s;
  color: rgba(140,160,185,0.35);
  border: none; background: transparent;
  text-decoration: none; display: inline-block;
}
.nav-pill:hover { color: rgba(140,160,185,0.75); }
.nav-pill.active {
  background: rgba(140,160,185,0.1);
  color: var(--silver-dim);
  border: 0.5px solid rgba(140,160,185,0.28);
}
</style>
</head>

      <span class="snapshot-stat" id="snapshot-stat">0 / 52</span>
    </div>
  </div>

  <!-- Month tabs -->
  <div class="month-nav" id="month-nav"></div>

  <!-- Content -->
  <div class="content-area">
    <!-- Composer -->
    <div class="composer" id="composer">
      <div class="composer-meta">
        <span class="composer-date" id="composer-date-label"></span>
        <input type="text" class="tag-input" id="composer-tag" placeholder="tag (poem, note, reflection…)" maxlength="30" />
      </div>
      <textarea class="composer-textarea" id="composer-textarea" rows="6"
        placeholder="Write freely. Poems, notes, fragments, streams of thought — all of it belongs here."
        oninput="updateCharCount()"></textarea>
      <div class="composer-footer">
        <span class="char-count" id="char-count">0 words</span>
        <button class="save-btn" onclick="saveEntry()">Save Entry</button>
      </div>
    </div>

    <!-- Entries by month -->
    <div id="entries-container"></div>
  </div>
</div>
</div><!-- /page-wrap -->

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="nav-pill" href="Growth.html">Home</a>
    <a class="nav-pill active" href="Journal.html">Journal</a>
    <a class="nav-pill" href="wants.html">Wants</a>
    <a class="nav-pill" href="inspo.html">Inspo</a>
    <a class="nav-pill" href="therapy.html">Therapy</a>
  </div>
</div>

<script>
// ── SUPABASE CONFIG ──
const SB_URL = 'https://ghcpmekdumlqrmjruuyn.supabase.co';
const SB_KEY = 'sb_publishable_Am9YxRGdHcF9eIDD032STA_FuyKXaYj';
async function sbGet(table, id) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
    const d = await r.json(); return d && d[0] ? d[0] : null;
  } catch(e) { return null; }
}
async function sbUpsert(table, row) {
  try {
    await fetch(`${SB_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify({ ...row, updated_at: new Date().toISOString() })
    });
  } catch(e) {}
}
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

// ── SEEDED ENTRIES FROM UPLOADED FILE ──
const SEED_ENTRIES = [
  {
    id: 'seed-1',
    date: '2026-01-05',
    tag: 'reflection',
    text: `[ Paste your January 5 entry here from Notion Inputs ]`,
    month: '2026-01'
  },
  {
    id: 'seed-2',
    date: '2026-01-12',
    tag: 'note',
    text: `[ Paste your January 12 entry here from Notion Inputs ]`,
    month: '2026-01'
  },
  {
    id: 'seed-3',
    date: '2026-01-19',
    tag: 'reflection',
    text: `[ Paste your January 19 entry here from Notion Inputs ]`,
    month: '2026-01'
  },
  {
    id: 'seed-4',
    date: '2026-01-26',
    tag: 'note',
    text: `[ Paste your January 26 entry here from Notion Inputs ]`,
    month: '2026-01'
  },
  {
    id: 'seed-5',
    date: '2026-01-28',
    tag: 'note',
    text: `[ Paste your January 28 entry here from Notion Inputs ]`,
    month: '2026-01'
  }
];

// ── STATE ──
let entries = [];
// weekMap: Set of ISO week strings "YYYY-Www" that have entries
let weekMap = new Set();

function getISOWeek(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + String(week).padStart(2,'0');
}

function weekIndexOf2026(dateStr) {
  // Returns 0-51 index for a given date within 2026
  const d = new Date(dateStr + 'T12:00:00');
  const jan1_2026 = new Date('2026-01-01T12:00:00');
  return Math.floor((d - jan1_2026) / (7 * 24 * 60 * 60 * 1000));
}

async function loadState() {
  const row = await sbGet('journal', 'singleton');
  if (row && row.entries && row.entries.length) {
    entries = row.entries;
    weekMap = new Set(row.entries.map(e => getISOWeek(e.date)));
  } else {
    try {
      const s = lsGet('jv_growth_journal_v2');
      if (s) { const parsed = JSON.parse(s); entries = parsed.entries || []; weekMap = new Set(parsed.weekMap || []); }
    } catch(e) {}
    if (entries.length === 0) {
      entries = SEED_ENTRIES;
      SEED_ENTRIES.forEach(e => weekMap.add(getISOWeek(e.date)));
      await persist();
    }
  }
}

async function persist() {
  await sbUpsert('journal', { id: 'singleton', entries });
  lsSet('jv_growth_journal_v2', JSON.stringify({ entries, weekMap: [...weekMap] }));
}

// ── SNAPSHOT STRIP ──
function renderWeekGrid() {
  const entryWeekIndices = new Set();
  entries.forEach(e => {
    if (e.date.startsWith('2026-')) {
      const idx = weekIndexOf2026(e.date);
      if (idx >= 0 && idx < 52) entryWeekIndices.add(idx);
    }
  });
  const count = entryWeekIndices.size;
  const pct = Math.round((count / 52) * 100);
  document.getElementById('snapshot-stat').textContent = count + ' / 52';
  document.getElementById('snapshot-bar').style.width = pct + '%';
}

// ── MONTHS ──
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let activeMonth = null;

function getMonths() {
  const months = new Set(entries.map(e => e.month));
  const now = new Date();
  const cur = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  months.add(cur);
  return [...months].sort().reverse();
}

function renderMonthNav() {
  const months = getMonths();
  const nav = document.getElementById('month-nav');
  nav.innerHTML = '';
  if (!activeMonth || !months.includes(activeMonth)) activeMonth = months[0];
  months.forEach(m => {
    const [y, mo] = m.split('-');
    const label = MONTH_NAMES[parseInt(mo)-1] + ' \'' + y.slice(2);
    const pill = document.createElement('span');
    pill.className = 'month-tab' + (m === activeMonth ? ' active' : '');
    pill.textContent = label;
    pill.onclick = () => { activeMonth = m; renderMonthNav(); renderEntries(); };
    nav.appendChild(pill);
  });
}

// ── COMPOSER ──
let composerOpen = false;

function toggleComposer() {
  composerOpen = !composerOpen;
  document.getElementById('composer').classList.toggle('open', composerOpen);
  if (composerOpen) {
    const now = new Date();
    document.getElementById('composer-date-label').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('composer-textarea').focus();
  }
}

function updateCharCount() {
  const text = document.getElementById('composer-textarea').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('char-count').textContent = words + (words === 1 ? ' word' : ' words');
}

function saveEntry() {
  const text = document.getElementById('composer-textarea').value.trim();
  if (!text) { document.getElementById('composer-textarea').focus(); return; }
  const tag = document.getElementById('composer-tag').value.trim() || 'entry';
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];
  const month = dateStr.slice(0,7);

  entries.unshift({ id: Date.now().toString(), date: dateStr, tag, text, month });
  weekMap.add(getISOWeek(dateStr));
  persist();

  document.getElementById('composer-textarea').value = '';
  document.getElementById('composer-tag').value = '';
  document.getElementById('char-count').textContent = '0 words';
  composerOpen = false;
  document.getElementById('composer').classList.remove('open');

  activeMonth = month;
  renderAll();
}

// ── ENTRIES ──
function formatEntryDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function wordCount(text) {
  return text.trim() ? text.trim().split(/\s+/).length : 0;
}
function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderEntries() {
  const container = document.getElementById('entries-container');
  container.innerHTML = '';
  const monthEntries = entries.filter(e => e.month === activeMonth);
  const [y, mo] = activeMonth.split('-');
  const section = document.createElement('div');
  section.className = 'month-section';
  section.innerHTML = `
    <div class="month-heading">
      <span class="month-heading-label">${MONTH_NAMES[parseInt(mo)-1]} ${y}</span>
      <div class="month-heading-line"></div>
      <span class="month-count">${monthEntries.length} ${monthEntries.length===1?'entry':'entries'}</span>
    </div>`;
  if (monthEntries.length === 0) {
    section.innerHTML += `<div class="empty-month"><p>No entries yet this month.<br>Begin when you're ready.</p></div>`;
  } else {
    monthEntries.forEach(e => section.appendChild(buildCard(e)));
  }
  container.appendChild(section);
}

function buildCard(entry) {
  const card = document.createElement('div');
  card.className = 'entry-card';
  card.id = 'entry-' + entry.id;
  const preview = entry.text.slice(0,80).replace(/\n/g,' ');
  card.innerHTML = `
    <div class="entry-header" onclick="toggleCard('${entry.id}')">
      <div class="entry-header-left">
        <span class="entry-date-label">${formatEntryDate(entry.date)}</span>
        <span class="entry-tag">${escHtml(entry.tag)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="entry-preview">${escHtml(preview)}…</span>
        <span class="entry-chevron">▼</span>
      </div>
    </div>
    <div class="entry-body">
      <textarea class="editable-text" id="text-${entry.id}" rows="8"
        oninput="autoSave('${entry.id}',this.value)">${escHtml(entry.text)}</textarea>
      <div class="entry-footer">
        <span class="entry-wordcount" id="wc-${entry.id}">${wordCount(entry.text)} words</span>
        <div class="entry-actions">
          <button class="entry-action-btn danger" onclick="deleteEntry('${entry.id}')">Delete</button>
        </div>
      </div>
    </div>`;
  return card;
}

function toggleCard(id) {
  const card = document.getElementById('entry-' + id);
  card.classList.toggle('open');
  if (card.classList.contains('open')) card.querySelector('textarea').focus();
}

const saveTimers = {};
function autoSave(id, val) {
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(() => {
    const e = entries.find(e => e.id === id);
    if (e) {
      e.text = val;
      persist();
      const wc = document.getElementById('wc-' + id);
      if (wc) wc.textContent = wordCount(val) + ' words';
    }
  }, 600);
}

function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  // Rebuild weekMap from remaining entries
  weekMap = new Set(entries.map(e => getISOWeek(e.date)));
  persist();
  renderAll();
}

function renderAll() {
  renderWeekGrid();
  renderMonthNav();
  renderEntries();
}

// ── INIT ──
loadState();
renderAll();
</script>
</body>
</html>
