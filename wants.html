<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root {
  --ink: #060606;
  --ink-mid: #111;
  --white: rgba(255,255,255,0.93);
  --white-dim: rgba(255,255,255,0.55);
  --white-ghost: rgba(255,255,255,0.18);
  --white-veil: rgba(255,255,255,0.07);
  --accent: #fff;
  --glass: rgba(8,8,8,0.58);
  --glass-border: rgba(255,255,255,0.13);
  --font-display: 'Cormorant Garamond', serif;
  --font-mono: 'DM Mono', monospace;
}

html, body {
  min-height: 100vh;
  background: #060606;
  font-family: var(--font-mono);
  color: var(--white);
  overflow-x: hidden;
}

/* ── BACKGROUND ── */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 18%;
  filter: brightness(0.88) contrast(1.08) grayscale(0.15);
}
.bg-vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 90% 55% at 50% 100%, rgba(0,0,0,0.92) 0%, transparent 70%),
    radial-gradient(ellipse 60% 35% at 50% 0%, rgba(0,0,0,0.65) 0%, transparent 60%),
    linear-gradient(to right, rgba(0,0,0,0.6) 0%, transparent 22%, transparent 78%, rgba(0,0,0,0.6) 100%);
}

/* ── PAGE ── */
.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding-bottom: 6rem;
}

/* ── HEADER ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2rem 1.5rem 1.25rem;
  max-width: 980px;
  margin: 0 auto;
}
.header-left { display: flex; align-items: center; gap: 1rem; }

.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 0.5px solid var(--glass-border);
  background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  flex-shrink: 0; backdrop-filter: blur(8px);
  color: var(--white-dim); font-size: 14px;

}
.back-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--white-ghost); }

.page-title-wrap .eyebrow {
  font-size: 8px; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--white-ghost);

}
.page-title-wrap h1 {

}
.page-title-wrap h1 em { font-style: italic; color: rgba(255,255,255,0.75); }

.add-btn {

  padding: 9px 20px;
  background: rgba(255,255,255,0.07);
  border: 0.5px solid rgba(255,255,255,0.22);
  border-radius: 100px;
  color: var(--white-dim); cursor: pointer; transition: all 0.25s;
  backdrop-filter: blur(8px);
  white-space: nowrap;
}
.add-btn:hover { background: rgba(255,255,255,0.13); color: var(--white); border-color: rgba(255,255,255,0.42); }

/* ── FILTERS ── */
.filter-bar {
  max-width: 980px; margin: 0 auto;
  padding: 0 1.5rem 1.25rem;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-pill {
  font-family: var(--font-mono);
  font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 100px;
  border: 0.5px solid var(--glass-border);
  background: rgba(0,0,0,0.3);
  color: var(--white-ghost); cursor: pointer; transition: all 0.2s;
  white-space: nowrap; backdrop-filter: blur(6px);
  user-select: none;
}
.filter-pill:hover { color: var(--white-dim); border-color: var(--white-ghost); }
.filter-pill.active {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.3);
  color: var(--white);
}

/* ── GRID ── */
.wants-grid {
  max-width: 980px; margin: 0 auto;
  padding: 0 1.5rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
}

/* ── WANT CARD ── */
.want-card {
  background: var(--glass);
  border: 0.5px solid var(--glass-border);
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(16px);
  transition: border-color 0.3s, transform 0.3s;
  cursor: pointer;
  position: relative;
}
.want-card:hover { border-color: rgba(255,255,255,0.26); transform: translateY(-3px); }
.want-card.acquired { border-color: rgba(255,255,255,0.32); }
.card-acquired-badge {

  font-family: var(--font-mono);
  font-size: 7px; letter-spacing: 0.13em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 100px;
  background: rgba(0,0,0,0.65);
  border: 0.5px solid rgba(255,255,255,0.25);
  color: var(--white-dim);
  backdrop-filter: blur(6px);
  white-space: nowrap;
}

/* Image */
.card-img-wrap {
  width: 100%; aspect-ratio: 4/3;
  background: rgba(15,15,15,0.85);
  position: relative; overflow: hidden;
}
.card-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(18%); transition: transform 0.4s, filter 0.3s; }
.want-card:hover .card-img { transform: scale(1.04); filter: grayscale(0%); }
.card-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: rgba(255,255,255,0.1); }
.card-img-upload { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.55); cursor: pointer; }
.card-img-wrap:hover .card-img-upload { opacity: 1; }
.card-img-upload span { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--white-dim); }
.img-input { display: none; }

/* Card body */
.card-body { padding: 1rem 1.1rem 1.1rem; }
.card-cat { font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--white-ghost); margin-bottom: 5px; }
.card-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 400; color: var(--white); line-height: 1.25; margin-bottom: 7px; }
.card-cost { font-family: var(--font-display); font-size: 1rem; font-style: italic; color: var(--white-dim); margin-bottom: 7px; }
.card-notes { font-family: var(--font-mono); font-size: 10px; line-height: 1.65; color: var(--white-ghost); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.card-link { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white-ghost); text-decoration: none; border-bottom: 0.5px solid rgba(255,255,255,0.18); padding-bottom: 1px; transition: color 0.2s, border-color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

option { background: #111; }

async function sbGet(table, id) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });

async function sbUpsert(table, row) {
  try {
    await fetch(`${SB_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,

}

// ── NEW: image compression + Storage upload (replaces base64-in-row) ──
function compressImage(file, maxWidth = 700, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('compression failed'));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

async function sbUploadImage(blob, filename) {
  try {
    const r = await fetch(`${SB_URL}/storage/v1/object/${IMAGE_BUCKET}/${filename}`, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'image/jpeg',
        'x-upsert': 'true'
      },
      body: blob
    });
    if (!r.ok) { console.error('Storage upload failed', r.status, await r.text()); return null; }
    return `${SB_URL}/storage/v1/object/public/${IMAGE_BUCKET}/${filename}`;
  } catch(e) { console.error('Storage upload error', e); return null; }
}

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

const CATS = ['Fashion','Experience','Career','Personal','Travel','Home'];
let wants = [];
let currentFilter = 'All';
let pendingImgBlob = null;      // compressed JPEG blob awaiting upload on save
let pendingImgPreviewUrl = null;
let detailId = null;
let editingId = null;

async function persist() {
  // `wants` now only ever stores small text fields + a Storage URL string per
  // image, so this row stays tiny no matter how many wishlist items exist.
  await sbUpsert('wants', { id: 'singleton', items: wants });
  lsSet('wants_v2', JSON.stringify(wants));
}

// ── BOOTSTRAP ──
async function initWants() {
  const row = await sbGet('wants', 'singleton');
  if (row && row.items) { wants = row.items; }
  else { try { const s = lsGet('wants_v2'); if (s) wants = JSON.parse(s); } catch(e) {} }
  renderFilters(); renderGrid();
}
initWants();

/* ── FILTER BAR ── */
function renderFilters() {
  const bar = document.getElementById('filter-bar');
  const all = ['All', ...CATS];
  bar.innerHTML = all.map(c => `
    <span class="filter-pill ${c===currentFilter?'active':''}" onclick="setFilter('${c}')">${c}</span>
  `).join('');
}
function setFilter(cat) {
  currentFilter = cat;
  renderFilters();
  renderGrid();
}

/* ── GRID ── */
function renderGrid() {
  const grid = document.getElementById('wants-grid');
  const filtered = wants.filter(w => currentFilter === 'All' || w.cat === currentFilter);
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><p>Nothing here yet.<br>Add what you desire.</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(w => `
    <div class="want-card ${w.acquired?'acquired':''}" onclick="openDetail(${w.id})">
      <div class="card-img-wrap">
        ${w.acquired ? `<div class="card-acquired-badge">✓ ${w.acquiredDate ? formatDateDisplay(w.acquiredDate) : 'acquired'}</div>` : ''}
        ${w.img
          ? `<img class="card-img" src="${w.img}" />`
          : `<div class="card-img-placeholder">✦</div>`}
        <div class="card-img-upload" onclick="event.stopPropagation(); document.getElementById('ci-${w.id}').click()">
          <span>Change Image</span>
          <input type="file" id="ci-${w.id}" class="img-input" accept="image/*" onchange="handleCardImg(${w.id}, this)">
        </div>
      </div>
      <div class="card-body">
        <p class="card-cat">${w.cat||'—'}</p>
        <h3 class="card-title">${escHtml(w.name)}</h3>
        ${w.cost ? `<p class="card-cost">${escHtml(w.cost)}</p>` : ''}
        ${w.notes ? `<p class="card-notes">${escHtml(w.notes)}</p>` : ''}
        <div class="card-footer">
          ${w.url ? `<a class="card-link" href="${w.url}" target="_blank" onclick="event.stopPropagation()">${urlLabel(w.url)}</a>` : `<span></span>`}
          <div class="card-check ${w.acquired?'done':''}" onclick="event.stopPropagation(); quickToggle(${w.id}, this)">${w.acquired?'✓':''}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function urlLabel(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; }
}
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function formatDateDisplay(iso) {
  if (!iso) return '';
  // Parse as local date (avoid UTC shift from bare yyyy-mm-dd)
  const [y,m,d] = iso.split('-').map(Number);
  if (!y) return iso;
  const dt = new Date(y, (m||1)-1, d||1);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function quickToggle(id, el) {
  const w = wants.find(x => x.id === id);
  if (!w) return;
  w.acquired = !w.acquired;
  if (w.acquired && !w.acquiredDate) w.acquiredDate = todayISO();
  if (!w.acquired) w.acquiredDate = null;
  persist();
  renderGrid();
}

/* ── ADD MODAL ── */
function openAddModal() {
  editingId = null;
  pendingImgBlob = null;
  if (pendingImgPreviewUrl) { URL.revokeObjectURL(pendingImgPreviewUrl); pendingImgPreviewUrl = null; }
  document.getElementById('modal-title').textContent = 'New Want';
  document.getElementById('m-name').value = '';
  document.getElementById('m-cat').value = '';
  document.getElementById('m-cost').value = '';
  document.getElementById('m-acquired').value = '';
  document.getElementById('m-url').value = '';
  document.getElementById('m-notes').value = '';
  document.getElementById('modal-img-preview').style.display = 'none';
  document.getElementById('upload-label').style.display = '';
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}
document.getElementById('add-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('add-modal')) closeAddModal();
});

function handleImgUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const label = document.getElementById('upload-label');
  label.textContent = 'Compressing…';
  label.style.display = '';
  compressImage(file).then((compressed) => {
    pendingImgBlob = compressed;
    if (pendingImgPreviewUrl) URL.revokeObjectURL(pendingImgPreviewUrl);
    pendingImgPreviewUrl = URL.createObjectURL(compressed);
    const preview = document.getElementById('modal-img-preview');
    preview.src = pendingImgPreviewUrl;
    preview.style.display = 'block';
    label.style.display = 'none';
  }).catch(err => {
    console.error('Image compression failed', err);
    label.textContent = 'Upload failed — try again';
  });
}

function handleCardImg(id, input) {
  const file = input.files[0];
  if (!file) return;
  compressImage(file).then(async (compressed) => {
    const filename = `item-${id}-${Date.now()}.jpg`;
    const url = await sbUploadImage(compressed, filename);
    if (!url) return; // upload failed; leave existing image untouched
    const w = wants.find(x => x.id === id);
    if (w) { w.img = url; persist(); renderGrid(); }
  }).catch(err => console.error('Image compression failed', err));
}

async function saveWant() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { document.getElementById('m-name').focus(); return; }
  let url = document.getElementById('m-url').value.trim();
  if (url && !url.startsWith('http')) url = 'https://' + url;

  const saveBtn = document.querySelector('.modal-confirm');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

  let imageUrl = null;
  if (pendingImgBlob) {
    const filename = `item-${editingId || Date.now()}-${Date.now()}.jpg`;
    imageUrl = await sbUploadImage(pendingImgBlob, filename);
    // if upload fails, imageUrl stays null; existing image (on edit) is preserved below
  }

  const acquiredDateVal = document.getElementById('m-acquired').value; // yyyy-mm-dd or ''

  if (editingId) {
    const w = wants.find(x => x.id === editingId);
    w.name = name;
    w.cat = document.getElementById('m-cat').value;
    w.cost = document.getElementById('m-cost').value.trim();
    w.url = url;
    w.notes = document.getElementById('m-notes').value.trim();
    if (imageUrl) w.img = imageUrl;
    // Setting a date always marks it acquired. Clearing the date just removes
    // the date but leaves the acquired flag alone (use the toggle to un-acquire).
    w.acquiredDate = acquiredDateVal || null;
    if (acquiredDateVal) w.acquired = true;
  } else {
    wants.unshift({
      id: Date.now(), name, cat: document.getElementById('m-cat').value,
      cost: document.getElementById('m-cost').value.trim(), url,
      notes: document.getElementById('m-notes').value.trim(), img: imageUrl,
      acquired: !!acquiredDateVal, acquiredDate: acquiredDateVal || null
    });
  }
  await persist();
  if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
  closeAddModal();
  renderGrid();
  if (detailId) openDetail(editingId || wants[0].id);
}

/* ── DETAIL ── */
function openDetail(id) {
  const w = wants.find(x => x.id === id);
  if (!w) return;
  detailId = id;
  const imgWrap = document.getElementById('detail-img-wrap');
  imgWrap.innerHTML = w.img ? `<img class="detail-img" src="${w.img}" />` : `<div class="detail-img-placeholder">✦</div>`;
  document.getElementById('d-cat').textContent = w.cat || '';
  document.getElementById('d-title').textContent = w.name;
  document.getElementById('d-cost').textContent = w.cost || '—';
  document.getElementById('d-notes').textContent = w.notes || '';
  const urlWrap = document.getElementById('d-url-wrap');
  const linkBtn = document.getElementById('d-link-btn');
  if (w.url) {
    urlWrap.style.display = '';
    try { document.getElementById('d-url-display').textContent = new URL(w.url).hostname.replace('www.',''); } catch(e) { document.getElementById('d-url-display').textContent = w.url; }
    linkBtn.href = w.url;
    linkBtn.style.display = '';
  } else { urlWrap.style.display = 'none'; linkBtn.style.display = 'none'; }
  const acqWrap = document.getElementById('d-acquired-wrap');
  if (w.acquired && w.acquiredDate) {
    acqWrap.style.display = '';
    document.getElementById('d-acquired-display').textContent = formatDateDisplay(w.acquiredDate);
  } else {
    acqWrap.style.display = 'none';
  }
  document.getElementById('d-acquire-btn').textContent = w.acquired ? 'Mark as Wanted' : 'Mark as Acquired';
  document.getElementById('detail-modal').classList.add('open');
}
function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); detailId = null; }
document.getElementById('detail-modal').addEventListener('click', e => { if (e.target === document.getElementById('detail-modal')) closeDetail(); });

function openEditModal() {
  const w = wants.find(x => x.id === detailId);
  if (!w) return;
  editingId = detailId;
  pendingImgBlob = null;
  if (pendingImgPreviewUrl) { URL.revokeObjectURL(pendingImgPreviewUrl); pendingImgPreviewUrl = null; }
  closeDetail();
  document.getElementById('modal-title').textContent = 'Edit Want';
  document.getElementById('m-name').value = w.name;
  document.getElementById('m-cat').value = w.cat || '';
  document.getElementById('m-cost').value = w.cost || '';
  document.getElementById('m-acquired').value = w.acquiredDate || '';
  document.getElementById('m-url').value = w.url || '';
  document.getElementById('m-notes').value = w.notes || '';
  if (w.img) {
    document.getElementById('modal-img-preview').src = w.img;
    document.getElementById('modal-img-preview').style.display = 'block';
    document.getElementById('upload-label').style.display = 'none';
  } else {
    document.getElementById('modal-img-preview').style.display = 'none';
    document.getElementById('upload-label').style.display = '';
  }
  document.getElementById('add-modal').classList.add('open');
}

function toggleAcquired() {
  const w = wants.find(x => x.id === detailId);
  if (!w) return;
  w.acquired = !w.acquired;
  if (w.acquired && !w.acquiredDate) w.acquiredDate = todayISO();
  if (!w.acquired) w.acquiredDate = null;
  document.getElementById('d-acquire-btn').textContent = w.acquired ? 'Mark as Wanted' : 'Mark as Acquired';
  const acqWrap = document.getElementById('d-acquired-wrap');
  if (w.acquired && w.acquiredDate) {
    acqWrap.style.display = '';
    document.getElementById('d-acquired-display').textContent = formatDateDisplay(w.acquiredDate);
  } else {
    acqWrap.style.display = 'none';
  }
  persist();
  renderGrid();
}

function deleteWant() {
  if (!confirm('Remove this want?')) return;
  wants = wants.filter(w => w.id !== detailId);
  persist();
  closeDetail();
  renderGrid();
}

/* ── INIT handled by initWants() above ── */
</script>
</body>
</html>
